<script>
/* ═══════════════════════════════════════════════════════════════
   👇👇👇 GANTI 2 NILAI DI BAWAH 👇👇👇
   ═══════════════════════════════════════════════════════════════ */
const KM_CONFIG = {
  API_URL:   'https://script.google.com/macros/s/AKfycbyZg0cm1HmToO9iZH3DUTq1SArVVJufweFJmRj-RV4il83dBxeId9opQPXV0bMzJi6a/exec',
  API_TOKEN: 'km_ubah_token_ini_jadi_panjang_dan_rahasia_2025'
};
/* ═══════════════════════════════════════════════════════════════
   ☝️☝️☝️ GANTI 2 NILAI DI ATAS ☝️☝️☝️
   ═══════════════════════════════════════════════════════════════ */

/* ============================================================
   API CLIENT (dengan timeout + retry)
   ============================================================ */
const KM_API = (() => {
  async function call(action, payload, opts) {
    opts = opts || {};
    const timeout = opts.timeout || 25000;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
      const res = await fetch(KM_CONFIG.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, token: KM_CONFIG.API_TOKEN, payload }),
        signal: controller.signal
      });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'API error');
      return data;
    } catch (e) {
      clearTimeout(timer);
      if (e.name === 'AbortError') throw new Error('Koneksi timeout — server lambat merespons');
      throw e;
    }
  }
  return {
    getAllData:    () => call('getAllData'),
    syncAll:       (state) => call('syncAll', state),
    updateBooking: (id, status) => call('updateBooking', { id, status }),
    deleteBooking: (id) => call('deleteBooking', { id })
  };
})();

/* ============================================================
   HELPERS
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el=id=>document.getElementById(id);
const rupiah=n=>'Rp'+Math.round(Number(n)||0).toLocaleString('id-ID');
const clampNum=n=>{const x=parseFloat(n);return(isNaN(x)||x<0)?0:x};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

function toast(msg,type){
  const t=document.createElement('div');
  const map={ok:'border-l-4 border-sage bg-white text-ink-900',err:'border-l-4 border-terra bg-white text-ink-900',wa:'border-l-4 border-wa bg-white text-ink-900','':'border-l-4 border-accent bg-white text-ink-900'};
  const icon={ok:'<i class="fa-solid fa-circle-check text-sage"></i>',err:'<i class="fa-solid fa-circle-exclamation text-terra"></i>',wa:'<i class="fa-brands fa-whatsapp text-wa"></i>','':'<i class="fa-solid fa-circle-info text-accent"></i>'};
  t.className='flex items-start gap-3 px-4 py-3 rounded-xl shadow-card text-[13px] font-medium animate-slide-up '+(map[type]||map['']);
  t.innerHTML=`<span class="mt-0.5 text-[13px] flex-shrink-0">${icon[type]||icon['']}</span><span class="leading-snug">${esc(msg)}</span>`;
  el('toasts').appendChild(t);
  setTimeout(()=>{try{t.remove()}catch(_){}},3400);
}
const confirmAction=msg=>window.confirm(msg);

/* ✅ FIX 1: Helper untuk set state.today — dipanggil di SEMUA jalur load */
function setToday(){
  const d = new Date();
  state.today = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12);
  if (!state.reportMonth || !state.reportMonth.year) {
    state.reportMonth = { year: d.getFullYear(), month: d.getMonth() };
  }
}

/* ============================================================
   SYNC INDICATOR
   ============================================================ */
function setSyncStatus(status,label){

/* ============================================================
   DATE ENGINE
   ============================================================ */
const MS=86400000;
function parseISO(iso){
  if(!iso)return null;
  const p=String(iso).split('-').map(Number);
  if(p.length!==3||p.some(isNaN))return null;
  return new Date(p[0],p[1]-1,p[2],12);
}
const toISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
const addDays=(d,n)=>{const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x};
function addMonthsClamped(date,n){
  const t=date.getMonth()+n,y=date.getFullYear()+Math.floor(t/12),m=((t%12)+12)%12;
  return new Date(y,m,Math.min(date.getDate(),daysInMonth(y,m)),12);
}
const diffDays=(a,b)=>Math.round((b.getTime()-a.getTime())/MS);
function calculateRentalEndDate(startISO,value,unit){
  const start=parseISO(startISO);
  if(!start||!value||value<=0)return null;
  let end;
  if(unit==='day')end=addDays(start,value-1);
  else if(unit==='week')end=addDays(start,value*7-1);
  else if(unit==='month')end=addDays(addMonthsClamped(start,value),-1);
  else return null;
  return{start,end,totalDays:diffDays(start,end)+1,value,unit};
}
function formatTanggalID(x,withDay){
  const d=typeof x==='string'?parseISO(x):x;
  if(!d)return'-';
  const b=`${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
  return withDay?`${HARI[d.getDay()]}, ${b}`:b;
}
function formatTanggalShort(x){
  const d=typeof x==='string'?parseISO(x):x;
  return d?`${d.getDate()} ${BULAN[d.getMonth()].slice(0,3)} ${d.getFullYear()}`:'-';
}
function formatDateTimeID(iso){
  const d=new Date(iso);
  if(isNaN(d))return'-';
  return `${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

let _persistTimer=null;
let _syncTimer=null;
let _syncing=false;
let _lastSyncJson=''; // ✅ FIX 4: cegah sync redundan

function persist(){
  clearTimeout(_persistTimer);
  _persistTimer=setTimeout(()=>{
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify({
        rooms:state.rooms,tenants:state.tenants,rentals:state.rentals,
        transactions:state.transactions,waHistory:state.waHistory,
        settings:state.settings,savedAt:new Date().toISOString()
      }));
    }catch(e){console.warn('Cache gagal:',e)}
  },200);
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(syncToSheets,1000);
}

async function syncToSheets(){
  if(_syncing)return;
  const payload={
    rooms:state.rooms,tenants:state.tenants,rentals:state.rentals,
    transactions:state.transactions,waHistory:state.waHistory,settings:state.settings
  };
  // ✅ FIX 4: skip jika tidak ada perubahan
  const json=JSON.stringify(payload);
  if(json===_lastSyncJson){setSyncStatus('ok','Tersinkron');return}
  _syncing=true;
  setSyncStatus('syncing','Menyimpan…');
  try{
    const res=await KM_API.syncAll(payload);
    if(!res.ok)throw new Error(res.error);
    _lastSyncJson=json;
    setSyncStatus('ok','Tersinkron');
  }catch(e){
    setSyncStatus('error','Gagal sync');
    toast('Gagal sync ke Sheets: '+e.message,'err');
  }finally{
    _syncing=false;
  }
}

function persistWA(){
  clearTimeout(_syncTimer);

}

function migrateData(d){
  if(Array.isArray(d.transactions)){
    d.transactions.forEach(t=>{
      if(t&&t.type&&MIGRATE_TX[t.type])t.type=MIGRATE_TX[t.type];
      if(!t.transactionDate)t.transactionDate=toISO(new Date());
      if(!t.paymentMethod)t.paymentMethod='Transfer Bank';
      if(typeof t.amount!=='number')t.amount=Number(t.amount)||0;
    });
  }
  if(Array.isArray(d.rooms))d.rooms.forEach(r=>{delete r.pricingPlans;if(r.manualStatus===undefined)r.manualStatus=null;if(!r.photos)r.photos='';if(!r.status)r.status='active';if(!r.description)r.description='';});
  if(Array.isArray(d.rentals))d.rentals.forEach(r=>{if(!Array.isArray(r.logs))r.logs=[]});
  if(!Array.isArray(d.waHistory))d.waHistory=[];
  if(!Array.isArray(d.bookings))d.bookings=[];
  return d;
}

/* ✅ FIX 1+5: loadFromServer selalu setToday & deteksi data kosong */
async function loadFromServer(){
  setToday();
  setSyncStatus('syncing','Memuat…');
  let cached=null;
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw)cached=JSON.parse(raw);
  }catch(_){}

  try{
    const res=await KM_API.getAllData();
    if(res.ok && res.data){
      const d=migrateData(res.data);
      const isEmpty=(!d.rooms||d.rooms.length===0)&&(!d.tenants||d.tenants.length===0);
      if(isEmpty){
        // ✅ FIX 5: Sheets kosong → biar di-seed oleh init()
        setSyncStatus('ok','Siap');
        return false;
      }
      state.rooms=d.rooms||[];
      state.tenants=d.tenants||[];
      state.rentals=d.rentals||[];
      state.transactions=d.transactions||[];
      state.waHistory=(d.waHistory||[]).slice(-WA_HISTORY_MAX);
      state.bookings=d.bookings||[];
      state.settings=Object.assign({lateFeePerDay:20000,kosName:'Kos Melati',kosAddress:'',kosPhone:'',kosDescription:''},d.settings||{});
      rebuildCounters();
      cacheLocally();
      _lastSyncJson=JSON.stringify({rooms:state.rooms,tenants:state.tenants,rentals:state.rentals,transactions:state.transactions,waHistory:state.waHistory,settings:state.settings});
      setSyncStatus('ok','Tersinkron');
      return true;
    }
  }catch(e){
    console.warn('Server tidak dapat dihubungi:',e);
    setSyncStatus('offline','Mode offline');
  }

  if(cached && Array.isArray(cached.rooms) && cached.rooms.length>0){
    const d=migrateData(cached);
    state.rooms=d.rooms||[];
    state.tenants=d.tenants||[];
    state.rentals=d.rentals||[];
    state.transactions=d.transactions||[];
    state.waHistory=(d.waHistory||[]).slice(-WA_HISTORY_MAX);
    state.settings=Object.assign({lateFeePerDay:20000,kosName:'Kos Melati',kosAddress:'',kosPhone:'',kosDescription:''},d.settings||{});
    rebuildCounters();
    toast('Mode offline: memakai data cache','');
    return true;
  }
  return false;
}

function importData(file){
  const rd=new FileReader();
  rd.onload=e=>{
    const txt=e.target.result;
    const isJSON=file.name.toLowerCase().endsWith('.json')||txt.trim().startsWith('{');
    if(isJSON){
      try{
        let d=JSON.parse(txt);
        if(!Array.isArray(d.rooms)||!Array.isArray(d.tenants))throw new Error('Format tidak valid');
        if(!confirmAction('Import akan MENGGANTI seluruh data (termasuk di Google Sheets). Lanjutkan?'))return;
        d=migrateData(d);
        state.rooms=d.rooms;
        state.tenants=d.tenants;
        state.rentals=d.rentals||[];
        state.transactions=d.transactions||[];
        state.waHistory=d.waHistory||[];
        state.settings=Object.assign({lateFeePerDay:20000},d.settings||{});
        rebuildCounters();
        _lastSyncJson=''; // force sync
        persist();
        render();
        toast('Data berhasil dimuat & disinkronkan','ok');
      }catch(err){toast('Gagal memuat: '+err.message,'err')}
    }else{
      try{
        const lines=txt.split(/\r?\n/).filter(l=>l.trim());
        if(lines.length<1)throw new Error('File kosong');
        const first=lines[0].toLowerCase();
        const startIdx=/nama|name/.test(first)?1:0;
        let added=0;
        for(let i=startIdx;i<lines.length;i++){
          const cols=lines[i].split(',').map(s=>s.trim().replace(/^"|"$/g,''));
          if(!cols[0])continue;
          state.tenants.push({id:nextId('TNT'),name:cols[0],phone:cols[1]||'-',notes:cols[2]||''});
          added++;
        }
        persist();render();
        toast(added+' penyewa ditambahkan','ok');
      }catch(err){toast('Gagal memuat: '+err.message,'err')}
    }
  };
  rd.readAsText(file);
}

function calculateBilling(rental){
  const txs=state.transactions.filter(t=>t.rentalId===rental.id);
  const sum=k=>txs.filter(t=>(TX[t.type]||{}).kind===k).reduce((s,t)=>s+(Number(t.amount)||0),0);
  const totalDibayar=sum('payment');
  const biayaTambahan=sum('charge');
  const depositMasuk=sum('deposit');
  const refund=sum('refund');
  const totalTagihan=rental.totalPrice+biayaTambahan;
  return{transactions:txs,totalSewa:rental.totalPrice,biayaTambahan,totalTagihan,totalDibayar,sisa:Math.max(0,totalTagihan-totalDibayar),depositMasuk,refund};
}
function getPaymentStatus(b){
  if(b.totalTagihan<=0)return{label:'—',tone:'muted'};
  if(b.sisa<=0)return{label:'Lunas',tone:'success'};
  if(b.totalDibayar>0)return{label:'Belum Lunas',tone:'warning'};
  return{label:'Belum Bayar',tone:'danger'};
}
function calculateLateDays(r,today){
  today=today||state.today;
  const e=parseISO(r.endDate);
  if(!e)return 0;
  const l=diffDays(e,today);
  return l>0?l:0;
}
function calculateLateFee(r,today){
  const days=calculateLateDays(r,today);
  return{days,amount:days*state.settings.lateFeePerDay};
}
function getRentalStatus(r,today){
  today=today||state.today;
  if(!today)return{code:'unknown',label:'—',tone:'muted'};
  if(r.status==='cancelled')return{code:'cancelled',label:'Dibatalkan',tone:'muted'};
  if(r.status==='finished')return{code:'finished',label:'Selesai',tone:'muted'};
  const s=parseISO(r.startDate),e=parseISO(r.endDate);
  if(!s||!e)return{code:'unknown',label:'—',tone:'muted'};
  if(today<s){const d=diffDays(today,s);return{code:'upcoming',label:`Mulai ${d} hari lagi`,tone:'info',daysToStart:d}}
  if(today<e){const d=diffDays(today,e);return{code:'active',label:`Aktif · ${d} hari lagi`,tone:'success',remainingDays:d}}
  if(today.getTime()===e.getTime())return{code:'lastday',label:'Jatuh tempo hari ini',tone:'warning',remainingDays:0};
  const late=diffDays(e,today);
  return{code:'overdue',label:`Terlambat ${late} hari`,tone:'danger',lateDays:late};
}
function getRoomDisplayStatus(room,today){
  today=today||state.today;
  if(room.manualStatus==='maintenance')return{code:'maintenance',label:'Perbaikan',tone:'muted'};
  const rs=state.rentals.filter(r=>r.roomId===room.id&&r.status!=='cancelled'&&r.status!=='finished');
  const active=rs.find(r=>parseISO(r.startDate)<=today&&today<=parseISO(r.endDate));
  if(active)return{code:'terisi',label:'Terisi',tone:'success',rental:active};
  const up=rs.filter(r=>parseISO(r.startDate)>today).sort((a,b)=>a.startDate.localeCompare(b.startDate))[0];
  if(up)return{code:'booking',label:'Sudah Dipesan',tone:'info',rental:up};
  return{code:'kosong',label:'Kosong',tone:'muted'};
}
const DUE_SOON_DAYS=7;
function getTaskList(today){
  today=today||state.today;
  const tasks={urgent:[],warning:[],info:[]};
  if(!today)return tasks;
  state.rentals.forEach(r=>{
    if(r.status==='cancelled'||r.status==='finished')return;
    const st=getRentalStatus(r,today);const b=calculateBilling(r);
    if(st.code==='overdue')tasks.urgent.push({rental:r,st,b,reason:`Terlambat ${st.lateDays} hari`});
    else if(st.code==='lastday')tasks.urgent.push({rental:r,st,b,reason:'Jatuh tempo hari ini'});
    else if(st.code==='active'&&st.remainingDays<=DUE_SOON_DAYS)tasks.warning.push({rental:r,st,b,reason:`Jatuh tempo ${st.remainingDays} hari lagi`});
    else if(st.code==='upcoming'&&st.daysToStart<=DUE_SOON_DAYS)tasks.info.push({rental:r,st,b,reason:`Mulai ${st.daysToStart} hari lagi`});
  });
  tasks.urgent.sort((a,b)=>a.rental.endDate.localeCompare(b.rental.endDate));
  tasks.warning.sort((a,b)=>a.rental.endDate.localeCompare(b.rental.endDate));
  tasks.info.sort((a,b)=>a.rental.startDate.localeCompare(b.rental.startDate));
  return tasks;
}
function checkRentalConflict(roomId,sISO,eISO,excl){
  const s=parseISO(sISO),e=parseISO(eISO);
  if(!s||!e)return null;
  return state.rentals.find(r=>r.roomId===roomId&&r.id!==excl&&r.status!=='cancelled'&&r.status!=='finished'&&s<=parseISO(r.endDate)&&parseISO(r.startDate)<=e)||null;
}

function buildReminderMessage(rental){

  else if(st.code==='active')L.push(`Kami dari manajemen kos ingin mengingatkan bahwa masa sewa kamar *${room?room.name:rental.roomId}* Anda akan berakhir dalam *${st.remainingDays} hari* pada *${formatTanggalID(rental.endDate,true)}*.`);
  else if(st.code==='upcoming')L.push(`Kami dari manajemen kos ingin mengingatkan bahwa masa sewa kamar *${room?room.name:rental.roomId}* Anda akan dimulai dalam *${st.daysToStart} hari* pada *${formatTanggalID(rental.startDate,true)}*.`);

  L.push(`• Total tagihan: ${rupiah(b.totalTagihan)}`);

   ============================================================ */
const bulkState={running:false,stop:false,index:0,rows:[],total:0};
function startBulkWA(){
  const tasks=getTaskList();
  const rows=[...tasks.urgent,...tasks.warning];
  if(!rows.length)return toast('Tidak ada yang perlu diingatkan','ok');
  const withPhone=rows.filter(x=>{const t=getTenant(x.rental.tenantId);return t&&cleanPhone(t.phone)});
  const noPhone=rows.length-withPhone.length;
  if(!withPhone.length)return toast('Semua penyewa belum punya nomor HP','err');
  const msg=`Kirim pengingat WhatsApp ke ${withPhone.length} penyewa?`+(noPhone?`\n\n(${noPhone} penyewa dilewati karena tanpa nomor HP)`:'')+`\n\nTab WhatsApp akan terbuka otomatis.`;
  if(!confirmAction(msg))return;
  bulkState.running=true;bulkState.stop=false;bulkState.index=0;
  bulkState.rows=withPhone;bulkState.total=withPhone.length;
  el('bulkPanel').classList.remove('hidden');
  updateBulkUI();
  runBulkNext();
}
function updateBulkUI(){
  const{index,total,rows}=bulkState;
  el('bulkCount').textContent=`${index} / ${total}`;
  if(index<total){
    const t=getTenant(rows[index].rental.tenantId);
    el('bulkLabel').textContent=`Mengirim ke ${t?t.name:''}...`;
  }else el('bulkLabel').textContent='Selesai';
  el('bulkBar').style.width=(total?(index/total*100):0)+'%';
}
function runBulkNext(){
  if(bulkState.stop||bulkState.index>=bulkState.total){finishBulk();return}
  const item=bulkState.rows[bulkState.index];
  const t=getTenant(item.rental.tenantId);
  const phone=cleanPhone(t?t.phone:'');
  if(!phone){bulkState.index++;updateBulkUI();setTimeout(runBulkNext,300);return}
  const msg=buildReminderMessage(item.rental);
  const url=`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
  const ok=openWA(url);
  if(!ok){bulkState.stop=true;finishBulk();return}
  logWASent(item.rental,msg);
  bulkState.index++;updateBulkUI();
  setTimeout(runBulkNext,1800);
}
function stopBulk(){bulkState.stop=true;toast('Dihentikan','')}
function finishBulk(){
  bulkState.running=false;
  toast(`Selesai — ${bulkState.index} pesan diproses`,'wa');
  render();
  setTimeout(()=>{el('bulkPanel').classList.add('hidden');el('bulkBar').style.width='0'},2000);
}

function viewRooms(){

  const pills=[['all','Semua'],['terisi','Terisi'],['kosong','Kosong'],['booking','Dipesan'],['maintenance','Perbaikan']];
  const rooms=state.rooms.filter(r=>f==='all'||getRoomDisplayStatus(r).code===f).filter(r=>matchQ(r.name,r.facilities));

  const roomCard=r=>{
    const s=getRoomDisplayStatus(r);
    const act=s.rental;
    const toneDot={success:'bg-sage',info:'bg-steel',muted:'bg-ink-300',danger:'bg-terra',warning:'bg-amber'}[s.tone]||'bg-ink-300';
    let info='';
    if(act){
      const b=calculateBilling(act);
      const st=getRentalStatus(act);
      info=`<div class="mt-3 pt-3 border-t border-ink-200/60">
        <div class="text-[12.5px] font-semibold text-ink-800 truncate">${esc(tenantName(act.tenantId))}</div>

        <div class="mt-1.5 flex items-center gap-1.5 flex-wrap">${badge(st.tone,st.label)}${b.sisa>0?badge('danger','Sisa '+rupiah(b.sisa)):''}</div>
      </div>`;
    }else{
      info=`<div class="mt-3 pt-3 border-t border-ink-200/60 text-[11.5px] text-ink-400">Ketuk untuk ${s.code==='maintenance'?'aktifkan kembali':'sewakan'}</div>`;
    }
    return `<button data-action="open-room" data-id="${r.id}" type="button" class="action-card text-left bg-white border border-ink-200/60 rounded-xl2 shadow-card p-4 sm:p-5 flex flex-col">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <div class="text-[13.5px] sm:text-[14px] font-bold text-ink-900 truncate">${esc(r.name)}</div>
          <div class="text-[10.5px] text-ink-400 mt-0.5 truncate">${esc(r.facilities||'')}</div>

          <span class="w-2 h-2 rounded-full ${toneDot}"></span>${s.label}

      ${info}
    </button>`;
  };

  return card(
    cardHead('Kamar',`${state.rooms.length} kamar · ${statusesAll.filter(s=>s.code==='terisi').length} terisi`,
      pillHTML(pills,f,'filter-rooms')+
      `<button class="btn-primary" data-action="add-room" type="button"><i class="fa-solid fa-plus text-[11px]"></i> <span class="hidden sm:inline">Tambah Kamar</span><span class="sm:hidden">Tambah</span></button>`)+
    (rooms.length?`<div class="p-4 sm:p-5 grid sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">${rooms.map(roomCard).join('')}</div>`:emptyState('fa-door-open','Tidak ada kamar yang cocok.'))
  );
}

function viewTenants(){
  const rows=state.tenants.filter(t=>matchQ(t.name,t.phone,t.notes)).map(t=>{
    const rs=state.rentals.filter(r=>r.tenantId===t.id&&r.status!=='cancelled'&&r.status!=='finished');
    const act=rs.find(r=>parseISO(r.startDate)<=state.today&&state.today<=parseISO(r.endDate))||null;
    const next=rs.filter(r=>parseISO(r.startDate)>state.today).sort((a,b)=>a.startDate.localeCompare(b.startDate))[0]||null;
    const shown=act||next;
    const type=detectTenantType(t.id,null);
    const b=shown?calculateBilling(shown):null;
    const ps=b?getPaymentStatus(b):null;
    const st=shown?getRentalStatus(shown):null;
    const room=shown?getRoom(shown.roomId):null;
    return `<button data-action="open-tenant" data-id="${t.id}" type="button" class="w-full text-left table-row border-t border-ink-200/60 hover:bg-ink-100/40 flex items-center gap-3 sm:gap-4 px-4 sm:px-5 py-3.5 sm:py-4">
      <div class="w-10 h-10 rounded-full bg-accent-soft flex items-center justify-center flex-shrink-0">
        <span class="text-[13px] font-bold text-accent">${esc((t.name||'?').slice(0,1).toUpperCase())}</span>
      </div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2 flex-wrap">
          <div class="font-semibold text-[13px] sm:text-[13.5px] text-ink-900 truncate">${esc(t.name)}</div>
          ${badge(type==='lama'?'info':'primary',type==='lama'?'Lama':'Baru')}

async function bookingRefresh(){
  try{
    setSyncStatus('syncing','Memuat booking…');
    const res=await KM_API.getAllData();
    if(res.ok && res.data){
      state.bookings=res.data.bookings||[];
      render();
      setSyncStatus('ok','Tersinkron');
      toast('Daftar booking diperbarui','ok');
    }
  }catch(e){
    setSyncStatus('error','Gagal');
    toast('Gagal refresh: '+e.message,'err');
  }
}
async function bookingSetStatus(id,status){
  const b=(state.bookings||[]).find(x=>x.id===id);
  if(!b)return;
  const labelMap={approved:'Setujui',rejected:'Tolak',pending:'Kembalikan ke Menunggu'};
  if(!confirmAction(`${labelMap[status]||'Ubah'} booking dari ${b.name}?`))return;
  try{
    setSyncStatus('syncing','Menyimpan…');
    const res=await KM_API.updateBooking(id,status);
    if(!res.ok)throw new Error(res.error);
    b.status=status;
    render();
    setSyncStatus('ok','Tersinkron');
    toast('Status booking diperbarui','ok');
  }catch(e){
    setSyncStatus('error','Gagal');
    toast('Gagal: '+e.message,'err');
  }
}
async function bookingDelete(id){
  const b=(state.bookings||[]).find(x=>x.id===id);
  if(!b)return;
  if(!confirmAction(`Hapus booking dari ${b.name}?`))return;
  try{
    setSyncStatus('syncing','Menghapus…');
    const res=await KM_API.deleteBooking(id);
    if(!res.ok)throw new Error(res.error);
    state.bookings=state.bookings.filter(x=>x.id!==id);
    render();
    setSyncStatus('ok','Tersinkron');
    toast('Booking dihapus','ok');
  }catch(e){
    setSyncStatus('error','Gagal');
    toast('Gagal: '+e.message,'err');
  }
}
function bookingWA(id){
  const b=(state.bookings||[]).find(x=>x.id===id);
  if(!b)return;
  const phone=cleanPhone(b.phone);
  const room=getRoom(b.roomId);
  const msg=`Halo *${b.name}*,\n\nTerima kasih sudah booking *${room?room.name:b.roomId}* mulai *${formatTanggalID(b.startDate,true)}* (${b.durationValue} ${b.durationUnit}).\n\nKami akan segera memproses booking Anda.\n\nTerima kasih.`;
  const url=phone?`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url,'_blank');
}
function bookingConvert(id){
  const b=(state.bookings||[]).find(x=>x.id===id);
  if(!b)return;
  if(!confirmAction(`Ubah booking ${b.name} menjadi sewa aktif?`))return;
  const tenant={id:nextId('TNT'),name:b.name,phone:b.phone||'-',email:b.email||'',notes:b.notes||''};
  state.tenants.push(tenant);
  const p=calculateRentalEndDate(b.startDate,b.durationValue,b.durationUnit);
  if(!p){toast('Periode booking tidak valid','err');return}
  const room=getRoom(b.roomId);
  const unit=b.durationUnit;
  let price=0;
  if(room){
    if(unit==='month')price=b.durationValue*room.priceMonthly;
    else if(unit==='week')price=b.durationValue*room.priceWeekly;
    else price=b.durationValue*room.priceDaily;
  }
  const rental={
    id:nextId('RTL'),roomId:b.roomId,tenantId:tenant.id,
    startDate:b.startDate,endDate:toISO(p.end),
    durationValue:b.durationValue,durationUnit:unit,
    totalPrice:price,
    status:parseISO(b.startDate)>state.today?'booked':'active',
    previousRentalId:null,availableDate:null,emptyDays:null,
    createdAt:toISO(state.today),logs:[]
  };
  state.rentals.push(rental);
  b.status='converted';
  KM_API.updateBooking(id,'converted').catch(()=>{});
  persist();render();
  toast('Booking diubah menjadi sewa aktif','ok');
  setTimeout(()=>{if(confirmAction('Catat pembayaran pertama sekarang?'))openTxForm(rental.id)},250);
}

const wizard={step:1,roomId:'',tenantMode:'existing',tenantId:'',newName:'',newPhone:'',startDate:'',durationValue:1,durationUnit:'month',totalPrice:0,priceTouched:false};

function openRentWizard(preset){
  preset=preset||{};
  wizard.step=1;
  wizard.roomId=preset.roomId||'';
  wizard.tenantMode='existing';
  wizard.tenantId=preset.tenantId||'';
  wizard.newName='';wizard.newPhone='';
  wizard.startDate=toISO(state.today||new Date());
  wizard.durationValue=1;wizard.durationUnit='month';
  wizard.totalPrice=0;wizard.priceTouched=false;
  renderWizard();
}
function renderWizard(){
  const stepIndicator=()=>{
    const labels=['Pilih Kamar','Pilih Penyewa','Durasi & Harga'];
    return `<div class="flex items-center gap-1.5 sm:gap-2 px-4 sm:px-6 pt-4 sm:pt-5">
      ${labels.map((l,i)=>{
        const num=i+1,active=num===wizard.step,done=num<wizard.step;
        return `<div class="flex items-center gap-1.5 sm:gap-2 flex-1 min-w-0">
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-bold flex-shrink-0 ${done?'bg-sage text-white':active?'bg-accent text-white':'bg-ink-200 text-ink-500'}">${done?'<i class="fa-solid fa-check text-[10px]"></i>':num}</span>
            <span class="text-[12px] font-semibold truncate hidden sm:inline ${active?'text-ink-900':'text-ink-400'}">${l}</span>
          </div>
          ${i<2?`<span class="flex-1 h-[2px] rounded-full ${done?'bg-sage':'bg-ink-200'}"></span>`:''}
        </div>`;
      }).join('')}
    </div>`;
  };

  let body='';
  if(wizard.step===1){
    const kosong=state.rooms.filter(r=>getRoomDisplayStatus(r).code==='kosong');
    const grid=kosong.map(r=>{
      const sel=r.id===wizard.roomId;
      return `<button data-action="wiz-room" data-id="${r.id}" type="button" class="action-card text-left bg-white border-2 ${sel?'border-accent shadow-card':'border-ink-200/60'} rounded-xl2 p-3.5 sm:p-4 hover:border-accent-ring transition-colors">
        <div class="flex items-start justify-between gap-2">
          <div class="text-[13.5px] sm:text-[14px] font-bold text-ink-900 truncate">${esc(r.name)}</div>
          ${sel?'<i class="fa-solid fa-circle-check text-accent"></i>':''}
        </div>
        <div class="text-[11px] text-ink-500 mt-0.5 truncate">${esc(r.facilities||'')}</div>
        <div class="text-[14px] sm:text-[15px] font-bold text-ink-900 bignum mt-2">${rupiah(r.priceMonthly)}<span class="text-[10.5px] text-ink-400 font-medium"> /bln</span></div>
      </button>`;
    }).join('');
    body=`<div class="p-4 sm:p-6">
      <h4 class="text-[13.5px] sm:text-[14px] font-bold text-ink-900 mb-1">Pilih kamar yang akan disewakan</h4>
      <p class="text-[12px] text-ink-500 mb-4">Hanya kamar kosong yang muncul di sini.</p>
      ${kosong.length?`<div class="grid sm:grid-cols-2 gap-2.5 sm:gap-3 max-h-[400px] overflow-y-auto pr-1">${grid}</div>`:emptyState('fa-door-closed','Semua kamar sudah terisi. Tambahkan kamar dulu di menu Kamar.')}
    </div>
    <div class="px-4 sm:px-6 py-4 border-t border-ink-200/60 bg-ink-100/40 flex justify-between gap-2">
      <button class="btn-secondary" data-action="close-modal" type="button">Batal</button>
      <button class="btn-primary" data-action="wiz-next" type="button" ${wizard.roomId?'':'disabled style="opacity:.5"'}>Lanjut <i class="fa-solid fa-arrow-right text-[11px]"></i></button>
    </div>`;
  } else if(wizard.step===2){
    const existing=state.tenants.length>0;
    const tenantOpts=state.tenants.map(t=>`<option value="${esc(t.id)}"${t.id===wizard.tenantId?' selected':''}>${esc(t.name)} ${t.phone?'· '+esc(t.phone):''}</option>`).join('');
    body=`<div class="p-4 sm:p-6 flex flex-col gap-4 sm:gap-5">
      <div>
        <h4 class="text-[13.5px] sm:text-[14px] font-bold text-ink-900 mb-1">Siapa yang menyewa?</h4>
        <p class="text-[12px] text-ink-500">Pilih penyewa lama, atau tambahkan orang baru.</p>
      </div>
      ${existing?`
        <div class="grid grid-cols-2 gap-2">
          <button data-action="wiz-tenant-mode" data-id="existing" type="button" class="rounded-xl border-2 ${wizard.tenantMode==='existing'?'border-accent bg-accent-soft':'border-ink-200/60 bg-white'} p-3.5 sm:p-4 text-left">
            <i class="fa-solid fa-user-check text-[14px] ${wizard.tenantMode==='existing'?'text-accent':'text-ink-400'}"></i>
            <div class="text-[12.5px] sm:text-[13px] font-bold text-ink-900 mt-2">Penyewa Lama</div>
            <div class="text-[11px] text-ink-500 mt-0.5">Sudah pernah menginap</div>
          </button>
          <button data-action="wiz-tenant-mode" data-id="new" type="button" class="rounded-xl border-2 ${wizard.tenantMode==='new'?'border-accent bg-accent-soft':'border-ink-200/60 bg-white'} p-3.5 sm:p-4 text-left">
            <i class="fa-solid fa-user-plus text-[14px] ${wizard.tenantMode==='new'?'text-accent':'text-ink-400'}"></i>
            <div class="text-[12.5px] sm:text-[13px] font-bold text-ink-900 mt-2">Orang Baru</div>
            <div class="text-[11px] text-ink-500 mt-0.5">Pertama kali menyewa</div>
          </button>
        </div>`:''}
      ${wizard.tenantMode==='existing'&&existing?`
        <label class="flex flex-col gap-1.5">
          <span class="text-[11px] font-semibold text-ink-400 tracking-wider uppercase">Pilih Penyewa</span>
          <select id="wizTenantSel" class="f-input"><option value="">— Pilih —</option>${tenantOpts}</select>
        </label>
      `:`
        <div class="grid sm:grid-cols-2 gap-3 sm:gap-4">
          ${fld('Nama Lengkap',`<input id="wizNewName" value="${esc(wizard.newName)}" class="f-input" placeholder="cth: Bu Sarah">`)}
          ${fld('No. WhatsApp',`<input id="wizNewPhone" value="${esc(wizard.newPhone)}" class="f-input" placeholder="08xx / 62xx">`)}
        </div>
      `}
    </div>
    <div class="px-4 sm:px-6 py-4 border-t border-ink-200/60 bg-ink-100/40 flex justify-between gap-2">
      <button class="btn-secondary" data-action="wiz-back" type="button"><i class="fa-solid fa-arrow-left text-[11px]"></i> Kembali</button>
      <button class="btn-primary" data-action="wiz-next" type="button">Lanjut <i class="fa-solid fa-arrow-right text-[11px]"></i></button>
    </div>`;
  } else {
    const room=getRoom(wizard.roomId);
    const preview=calculateRentalEndDate(wizard.startDate,wizard.durationValue,wizard.durationUnit);
    const autoPrice=room?autoPriceFor(room,wizard.durationValue,wizard.durationUnit):0;
    const shownPrice=wizard.priceTouched?wizard.totalPrice:autoPrice;
    const conflict=preview?checkRentalConflict(wizard.roomId,wizard.startDate,toISO(preview.end),null):null;
    const tenantLabel=wizard.tenantMode==='new'?(wizard.newName||'(orang baru)'):tenantName(wizard.tenantId);

    body=`<div class="p-4 sm:p-6 flex flex-col gap-4 sm:gap-5">
      <div>
        <h4 class="text-[13.5px] sm:text-[14px] font-bold text-ink-900 mb-1">Berapa lama & berapa harganya?</h4>
        <p class="text-[12px] text-ink-500">Harga otomatis terisi, tapi bisa diubah.</p>
      </div>
      <div class="rounded-xl2 bg-accent-soft border border-accent-ring/40 p-3.5 sm:p-4 flex items-center gap-3">
        <i class="fa-solid fa-circle-info text-accent"></i>
        <div class="min-w-0 text-[12.5px]">
          <div class="font-semibold text-ink-800 truncate">${esc(room?room.name:'-')}</div>
          <div class="text-ink-500 truncate">untuk ${esc(tenantLabel)}</div>
        </div>
      </div>
      ${fld('Tanggal Mulai',`<input id="wizStart" type="date" value="${esc(wizard.startDate)}" class="f-input">`)}
      <div class="grid grid-cols-2 gap-3">
        ${fld('Berapa lama?',`<input id="wizDur" type="number" min="1" value="${wizard.durationValue}" class="f-input">`)}
        ${fld('Satuan',`<select id="wizUnit" class="f-input">
          <option value="day"${wizard.durationUnit==='day'?' selected':''}>Hari</option>
          <option value="week"${wizard.durationUnit==='week'?' selected':''}>Minggu</option>
          <option value="month"${wizard.durationUnit==='month'?' selected':''}>Bulan</option>
        </select>`)}
      </div>
      ${fld('Harga Total (Rp)',`<input id="wizPrice" type="number" min="0" step="1000" value="${shownPrice||''}" class="f-input">`)}
      <div id="wizPreview" class="rounded-xl2 border border-ink-200/60 p-3.5 sm:p-4 text-[12.5px] leading-relaxed">
        ${preview?`<div class="flex items-center gap-2 text-ink-700"><i class="fa-solid fa-calendar-check text-accent flex-shrink-0"></i><span>Berakhir <strong>${formatTanggalID(toISO(preview.end),true)}</strong> · ${preview.totalDays} hari</span></div>${conflict?`<div class="mt-2 text-terra font-semibold"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Bentrok dengan ${esc(tenantName(conflict.tenantId))}</div>`:''}`:'<span class="text-ink-400">Isi tanggal & durasi.</span>'}
      </div>
    </div>
    <div class="px-4 sm:px-6 py-4 border-t border-ink-200/60 bg-ink-100/40 flex justify-between gap-2">
      <button class="btn-secondary" data-action="wiz-back" type="button"><i class="fa-solid fa-arrow-left text-[11px]"></i> Kembali</button>
      <button class="btn-primary" data-action="wiz-finish" type="button"><i class="fa-solid fa-check"></i> Sewakan</button>
    </div>`;
  }

  openModal(modalHeader('Sewakan Kamar','Ikuti langkah-langkahnya — hanya butuh 30 detik')+stepIndicator(wizard.step)+body,'lg');

  if(wizard.step===3){
    const upd=()=>{
      wizard.startDate=el('wizStart').value;
      wizard.durationValue=parseInt(el('wizDur').value,10)||0;
      wizard.durationUnit=el('wizUnit').value;
      const room=getRoom(wizard.roomId);
      if(!wizard.priceTouched&&room){
        const p=autoPriceFor(room,wizard.durationValue,wizard.durationUnit);
        el('wizPrice').value=p||'';
      }
      const preview=calculateRentalEndDate(wizard.startDate,wizard.durationValue,wizard.durationUnit);
      const conflict=preview?checkRentalConflict(wizard.roomId,wizard.startDate,toISO(preview.end),null):null;
      const box=el('wizPreview');
      if(box){
        box.innerHTML=preview?`<div class="flex items-center gap-2 text-ink-700"><i class="fa-solid fa-calendar-check text-accent flex-shrink-0"></i><span>Berakhir <strong>${formatTanggalID(toISO(preview.end),true)}</strong> · ${preview.totalDays} hari</span></div>${conflict?`<div class="mt-2 text-terra font-semibold"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Bentrok dengan ${esc(tenantName(conflict.tenantId))}</div>`:''}`:'<span class="text-ink-400">Isi tanggal & durasi.</span>';
      }
    };
    ['wizStart','wizDur','wizUnit'].forEach(id=>{const n=el(id);if(n){n.addEventListener('change',upd);n.addEventListener('input',upd)}});
    const price=el('wizPrice');
    if(price)price.addEventListener('input',()=>{wizard.priceTouched=true});
  }
  if(wizard.step===2&&wizard.tenantMode==='new')setTimeout(()=>{const n=el('wizNewName');if(n)n.focus()},50);
}
function autoPriceFor(room,value,unit){
  const v=clampNum(value);if(!v)return 0;
  if(unit==='month')return v*room.priceMonthly;
  if(unit==='week')return v*room.priceWeekly;
  return v*room.priceDaily;
}
function wizardNext(){
  if(wizard.step===1){
    if(!wizard.roomId)return toast('Pilih kamar dulu','err');
    wizard.step=2;renderWizard();
  } else if(wizard.step===2){
    if(wizard.tenantMode==='existing'){
      const sel=el('wizTenantSel');
      wizard.tenantId=sel?sel.value:'';
      if(!wizard.tenantId)return toast('Pilih penyewa dulu','err');
    } else {
      wizard.newName=(el('wizNewName').value||'').trim();
      wizard.newPhone=(el('wizNewPhone').value||'').trim();
      if(!wizard.newName)return toast('Nama penyewa wajib diisi','err');
    }
    wizard.step=3;renderWizard();
  }
}
function wizardBack(){if(wizard.step>1){wizard.step--;renderWizard()}}
function wizardFinish(){
  wizard.startDate=el('wizStart').value;
  wizard.durationValue=parseInt(el('wizDur').value,10)||0;
  wizard.durationUnit=el('wizUnit').value;
  const price=clampNum(el('wizPrice').value);
  if(!parseISO(wizard.startDate))return toast('Tanggal mulai tidak valid','err');
  if(wizard.durationValue<=0)return toast('Durasi harus lebih dari 0','err');
  if(price<=0)return toast('Harga harus lebih dari 0','err');
  const p=calculateRentalEndDate(wizard.startDate,wizard.durationValue,wizard.durationUnit);
  if(!p)return toast('Periode tidak valid','err');
  const conflict=checkRentalConflict(wizard.roomId,wizard.startDate,toISO(p.end),null);
  if(conflict)return toast(`Bentrok dengan ${tenantName(conflict.tenantId)}`,'err');
  let tenantId=wizard.tenantId;
  if(wizard.tenantMode==='new'){
    const nt={id:nextId('TNT'),name:wizard.newName,phone:wizard.newPhone||'-',notes:''};
    state.tenants.push(nt);tenantId=nt.id;
  }
  const status=parseISO(wizard.startDate)>state.today?'booked':'active';
  const rental={id:nextId('RTL'),roomId:wizard.roomId,tenantId,startDate:wizard.startDate,endDate:toISO(p.end),durationValue:wizard.durationValue,durationUnit:wizard.durationUnit,totalPrice:price,status,previousRentalId:null,availableDate:null,emptyDays:null,createdAt:toISO(state.today),logs:[]};
  state.rentals.push(rental);
  persist();closeModal();render();
  setTimeout(()=>{if(confirmAction('Sewa berhasil dibuat!\n\nCatat pembayaran pertama sekarang?'))openTxForm(rental.id);else toast('Sewa berhasil dibuat','ok')},200);
}

function exportTransactionsCSV(){
  const rows=[['Tanggal','Penyewa','Kamar','Jenis','Metode','Jumlah','Catatan']];
  state.transactions.slice().sort((a,b)=>a.transactionDate.localeCompare(b.transactionDate)).forEach(t=>{
    rows.push([t.transactionDate,tenantName(t.tenantId),(getRoom(t.roomId)||{}).name||'',TX[t.type]?TX[t.type].label:t.type,t.paymentMethod||'',Number(t.amount)||0,t.notes||'']);
  });
  downloadCSV('pembayaran-'+toISO(state.today)+'.csv',rows);
}
function exportBillsCSV(){
  const rows=[['Penyewa','Kamar','Periode','Total Tagihan','Dibayar','Belum Dibayar','Status']];
  state.rentals.filter(r=>r.status!=='cancelled').forEach(r=>{
    const b=calculateBilling(r);
    rows.push([tenantName(r.tenantId),(getRoom(r.roomId)||{}).name||'',`${r.startDate} s/d ${r.endDate}`,b.totalTagihan,b.totalDibayar,b.sisa,getRentalStatus(r).label]);
  });
  downloadCSV('tagihan-'+toISO(state.today)+'.csv',rows);
}
function exportReportCSV(){
  const rm=state.reportMonth;
  const msISO=toISO(new Date(rm.year,rm.month,1,12));
  const meISO=toISO(new Date(rm.year,rm.month+1,0,12));
  const rows=[['Tanggal','Penyewa','Kamar','Jenis','Metode','Jumlah','Catatan']];
  state.transactions.filter(t=>{const d=parseISO(t.transactionDate);return!!d&&t.transactionDate>=msISO&&t.transactionDate<=meISO}).forEach(t=>{
    rows.push([t.transactionDate,tenantName(t.tenantId),(getRoom(t.roomId)||{}).name||'',TX[t.type]?TX[t.type].label:t.type,t.paymentMethod||'',t.amount||0,t.notes||'']);
  });
  downloadCSV(`laporan-${rm.year}-${String(rm.month+1).padStart(2,'0')}.csv`,rows);
}
function exportWACSV(){
  const rows=[['Waktu','Penyewa','Kamar','No HP','Sisa','Pesan']];
  state.waHistory.forEach(w=>rows.push([w.sentAt||'',w.tenantName||'',(getRoom(w.roomId)||{}).name||w.roomId||'',w.phone||'',w.sisa||0,w.message||'']));
  downloadCSV('riwayat-wa.csv',rows);
}

/* ============================================================
   EVENT DELEGATION (FIX 3: hapus duplikasi handler)
   ============================================================ */
function switchView(v){
  state.activeView=v;
  if(state.q)state.q='';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action],[data-view],[data-global]');
  if(!t)return;
  const id=t.dataset.id;

  // Prioritas: data-action > data-global > data-view
  if(t.dataset.action){
    switch(t.dataset.action){
      case 'close-modal':closeModal();return;
      case 'close-drawer':closeDrawer();return;
      case 'stop-bulk':stopBulk();return;
      case 'preview-wa':previewReminder(id);return;
      case 'send-wa-custom':sendWACustom(id);return;
      case 'edit-tenant':closeDrawer();openTenantForm(id);return;
      case 'add-tenant':openTenantForm();return;
      case 'save-tenant':saveTenant(id||null);return;
      case 'add-room':openRoomForm();return;
      case 'edit-room':closeDrawer();openRoomForm(id);return;
      case 'save-room':saveRoom(id||null);return;
      case 'toggle-maint':{const r=getRoom(id);if(r){r.manualStatus=r.manualStatus==='maintenance'?null:'maintenance';persist();closeDrawer();render()}return;}
      case 'filter-rooms':state.filter.rooms=id;render();return;
      case 'open-room':openRoomDrawer(id);return;
      case 'open-tenant':openTenantDrawer(id);return;
      case 'rent-room':closeDrawer();openRentWizard({roomId:id});return;
      case 'rent-tenant':closeDrawer();openRentWizard({tenantId:id});return;
      case 'rent-extend':rentExtend(id);return;
      case 'open-rental':closeDrawer();openRentalDetail(id);return;
      case 'edit-rental':closeModal();openRentalForm(id);return;
      case 'add-tx':closeDrawer();openTxForm(id);return;
      case 'quick-pay':closeDrawer();openTxForm(id);return;
      case 'tx-fill-full':{const r=getRental(id);if(!r)return;const b=calculateBilling(r);el('txAmount').value=b.sisa;return;}
      case 'save-tx':saveTx(id);return;
      case 'del-tx':deleteTx(id);return;
      case 'finish-rental':setRentalStatus(id,'finished','Tandai selesai (checkout)');return;
      case 'cancel-rental':setRentalStatus(id,'cancelled','Batalkan');return;
      case 'bulk-wa':startBulkWA();return;
      case 'money-tab':state.moneyTab=id;render();return;
      case 'settings-tab':state.settingsTab=id;render();return;
      case 'bookings-tab':state.bookingsTab=id;render();return;
      case 'booking-refresh':bookingRefresh();return;
      case 'booking-approve':bookingSetStatus(id,'approved');return;
      case 'booking-reject':bookingSetStatus(id,'rejected');return;
      case 'booking-wa':bookingWA(id);return;
      case 'booking-convert':bookingConvert(id);return;
      case 'booking-delete':bookingDelete(id);return;
      case 'report-prev':case 'report-next':{
        const rm=state.reportMonth;
        const d=new Date(rm.year,rm.month+(t.dataset.action==='report-next'?1:-1),1,12);
        state.reportMonth={year:d.getFullYear(),month:d.getMonth()};
        render();return;
      }
      case 'export-tx':exportTransactionsCSV();return;
      case 'export-bills':exportBillsCSV();return;
      case 'export-report':exportReportCSV();return;
      case 'export-data':exportData();return;
      case 'export-sheets':exportFromSheets();return;
      case 'force-sync':{setSyncStatus('syncing','Menyimpan…');_lastSyncJson='';syncToSheets().then(()=>toast('Sinkron selesai','ok'));return;}
      case 'import-data':el('importFile').click();return;
      case 'reset-data':clearAllData();return;
      case 'save-settings':{
        state.settings.lateFeePerDay=clampNum(el('setLateFee')?.value||20000);
        if(el('setKosName'))state.settings.kosName=el('setKosName').value.trim();
        if(el('setKosAddress'))state.settings.kosAddress=el('setKosAddress').value.trim();
        if(el('setKosPhone'))state.settings.kosPhone=el('setKosPhone').value.trim();
        if(el('setKosDesc'))state.settings.kosDescription=el('setKosDesc').value.trim();
        persist();toast('Pengaturan disimpan','ok');return;
      }
      case 'open-wa-detail':openWADetail(id);return;
      case 'wa-resend':{const w=state.waHistory.find(x=>x.id===id);if(w)openWA(`https://wa.me/${cleanPhone(w.phone)}?text=${encodeURIComponent(w.message||'')}`);return;}
      case 'clear-wa':if(confirmAction('Hapus seluruh riwayat WhatsApp?')){state.waHistory=[];persistWA();render();toast('Riwayat dihapus','ok')}return;
      case 'export-wa':exportWACSV();return;
      case 'open-help':openHelp();return;
      case 'wiz-room':wizard.roomId=id;renderWizard();return;
      case 'wiz-tenant-mode':wizard.tenantMode=id;renderWizard();return;
      case 'wiz-next':wizardNext();return;
      case 'wiz-back':wizardBack();return;
      case 'wiz-finish':wizardFinish();return;
      case 'save-rental-edit':saveRentalEdit(id);return;
    }
    return;
  }

  if(t.dataset.global){
    if(t.dataset.global==='add-tenant')openTenantForm();
    else if(t.dataset.global==='rent-wizard')openRentWizard();
    return;
  }

  if(t.dataset.view!==undefined){switchView(t.dataset.view);return;}
});

      <button class="btn-ghost" data-action="close-modal" type="button">Lewati</button>

function openRentalForm(rentalId){
  const editing=rentalId?getRental(rentalId):null;
  if(!editing)return;
  const roomId=editing.roomId, tenantId=editing.tenantId;
  const startISO=editing.startDate, dv=editing.durationValue, du=editing.durationUnit;
  const roomOpts=state.rooms.map(r=>`<option value="${esc(r.id)}"${r.id===roomId?' selected':''}>${esc(r.name)} — ${rupiah(r.priceMonthly)}/bln</option>`).join('');
  const tenantOpts=state.tenants.map(t=>`<option value="${esc(t.id)}"${t.id===tenantId?' selected':''}>${esc(t.name)}</option>`).join('');
  openModal(
    modalHeader('Edit Sewa',`${esc(tenantName(tenantId))} · ${esc((getRoom(roomId)||{}).name||'')}`)+
    `<div class="p-4 sm:p-6 grid sm:grid-cols-2 gap-3 sm:gap-4">
      ${fld('Kamar',`<select id="rfRoom" class="f-input">${roomOpts}</select>`)}
      ${fld('Penyewa',`<select id="rfTenant" class="f-input">${tenantOpts}</select>`)}
      ${fld('Tanggal Mulai',`<input id="rfStart" type="date" value="${esc(startISO)}" class="f-input">`)}
      <div class="hidden sm:block"></div>
      ${fld('Durasi',`<input id="rfDur" type="number" min="1" value="${dv}" class="f-input">`)}
      ${fld('Satuan',`<select id="rfUnit" class="f-input"><option value="day"${du==='day'?' selected':''}>Hari</option><option value="week"${du==='week'?' selected':''}>Minggu</option><option value="month"${du==='month'?' selected':''}>Bulan</option></select>`)}
      <div class="sm:col-span-2">${fld('Harga Total (Rp)',`<input id="rfPrice" type="number" min="0" step="1000" value="${editing.totalPrice}" class="f-input">`)}</div>
    </div>
    <div class="px-4 sm:px-6 py-4 border-t border-ink-200/60 bg-ink-100/40 flex justify-end gap-2">
      <button class="btn-secondary" data-action="close-modal" type="button">Batal</button>
      <button class="btn-primary" data-action="save-rental-edit" data-id="${rentalId}" type="button">Simpan Perubahan</button>
    </div>`,'md'
  );
}
function saveRentalEdit(rentalId){
  const r=getRental(rentalId);if(!r)return;
  const roomId=el('rfRoom').value;
  const tenantId=el('rfTenant').value;
  const start=el('rfStart').value;
  const v=parseInt(el('rfDur').value,10)||0;
  const u=el('rfUnit').value;
  const price=clampNum(el('rfPrice').value);
  if(!parseISO(start))return toast('Tanggal tidak valid','err');
  if(v<=0)return toast('Durasi harus > 0','err');
  const p=calculateRentalEndDate(start,v,u);
  if(!p)return toast('Periode tidak valid','err');
  const conflict=checkRentalConflict(roomId,start,toISO(p.end),rentalId);
  if(conflict)return toast(`Bentrok dengan ${tenantName(conflict.tenantId)}`,'err');
  Object.assign(r,{roomId,tenantId,startDate:start,endDate:toISO(p.end),durationValue:v,durationUnit:u,totalPrice:price});
  r.logs=r.logs||[];r.logs.push({date:toISO(state.today),type:'edit',text:'Data sewa diedit',by:'admin'});
  persist();closeModal();render();
  toast('Perubahan disimpan','ok');
}

/* ============================================================
   BIND STATIC (FIX 3: tidak ada handler ganda)
   ============================================================ */
function bindStatic(){
  // ✅ FIX: globalAddBtn TIDAK lagi pakai direct listener — pakai delegation
  // ✅ FIX: helpBtn pakai data-action="open-help"
  el('helpBtn').setAttribute('data-action','open-help');
  el('importFile').addEventListener('change',e=>{
    const f=e.target.files[0];
    if(f)importData(f);
    e.target.value='';
  });
  el('modalBackdrop').addEventListener('click',e=>{if(e.target===el('modalBackdrop'))closeModal()});
  el('drawerBackdrop').addEventListener('click',e=>{if(e.target===el('drawerBackdrop'))closeDrawer()});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if(!el('drawerBackdrop').hidden)closeDrawer();
      else if(!el('modalBackdrop').hidden)closeModal();
    }
  });
}

/* ============================================================
   INIT (FIX 1,2,5)
   ============================================================ */
async function init(){
  setToday(); // ✅ FIX: state.today di-set SEBELUM apa pun

  el('content').innerHTML=`<div class="py-20 text-center text-ink-400">
    <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
    <p class="text-[13px] mt-3">Memuat data dari Google Sheets…</p>
    <p class="text-[11px] text-ink-400 mt-1">Maksimal 25 detik</p>
  </div>`;

  const ok=await loadFromServer();

  if(!ok){
    // ✅ FIX 5: Sheets kosong / tidak ada data → seed lalu push
    seedData();
    setSyncStatus('syncing','Menyiapkan data awal…');
    try{
      await syncToSheets();
    }catch(_){}
  } else if(state.rooms.length===0){
    // Defensive: kalau rooms kosong padahal data lain ada
    seedData();
    await syncToSheets();
  }

  bindStatic();
  render();
  setTimeout(showOnboarding,400);
}
init();
</script>
