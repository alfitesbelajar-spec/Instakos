<head>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        canvas: '#FAF9F5',
        surface: '#FFFFFF',
        ink: {
          900: '#1C1917', 800: '#292524', 700: '#44403C', 600: '#57534E',
          500: '#78716C', 400: '#A8A29E', 300: '#D6D3D1', 200: '#E7E5E4', 100: '#F5F5F4',
        },
        accent: { DEFAULT: '#3F3A34', hover: '#2A2520', soft: '#F2EFEA', ring: '#D9D3CA' },
        sage:   { DEFAULT: '#5B8266', soft: '#EDF3EE', ring: '#CFDDD3' },
        amber:  { DEFAULT: '#B8873F', soft: '#F8F1E2', ring: '#E8D8B6' },
        terra:  { DEFAULT: '#B0554A', soft: '#F6EDEA', ring: '#E5CCC6' },
        steel:  { DEFAULT: '#5C6F8A', soft: '#EDF1F6', ring: '#D0D9E4' },
        wa:     { DEFAULT: '#25D366', soft: '#E7F9EE' },
      },
      fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'] },
      boxShadow: {
        'soft':  '0 1px 2px 0 rgba(28,25,23,0.03), 0 1px 3px 0 rgba(28,25,23,0.04)',
        'card':  '0 1px 3px 0 rgba(28,25,23,0.03), 0 6px 20px -6px rgba(28,25,23,0.05)',
        'modal': '0 30px 80px -20px rgba(28,25,23,0.24)',
      },
      letterSpacing: { 'label': '0.08em' },
      borderRadius: { 'xl2': '16px' },
      animation: {
        'fade-in':  'fadeIn 180ms ease-out',
        'slide-up': 'slideUp 200ms ease-out',
      },
      keyframes: {
        fadeIn:  { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
        slideUp: { '0%': { opacity: 0, transform: 'translateY(8px)' }, '100%': { opacity: 1, transform: 'none' } },
      }
    }
  }
};
</script>

<style>
  html, body { background: #FAF9F5; }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #1C1917; }

  /* FIX (bug blur): atribut hidden harus selalu menang atas class Tailwind.
     Tanpa ini, overlay modal (class flex) tampil permanen & memblokir semua klik. */
  [hidden] { display: none !important; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #E7E5E4; border-radius: 8px; border: 3px solid #FAF9F5; }
  ::-webkit-scrollbar-thumb:hover { background: #D6D3D1; }
  .sidebar-scroll::-webkit-scrollbar-thumb { background: #3A3531; border-color: #221E1B; }
  .sidebar-dark { background: #1F1C1A; }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: none; border-color: #A8A29E; box-shadow: 0 0 0 4px rgba(63,58,52,0.08);
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  .table-row { transition: background 120ms ease; }
  @media (max-width: 1023px) {
    .nav-scroll { scrollbar-width: none; -ms-overflow-style: none; }
    .nav-scroll::-webkit-scrollbar { display: none; }
  }
  @media print { .no-print { display: none !important; } }

  /* ── Buttons ── */
  .btn-primary,.btn-secondary,.btn-wa,.btn-tertiary,.btn-danger-soft{
    display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
    padding:.55rem 1rem;border-radius:.75rem;font-size:13px;font-weight:600;
    cursor:pointer;white-space:nowrap;
    transition:background .12s ease,border-color .12s ease,color .12s ease;
  }
  .btn-primary{background:#3F3A34;color:#fff}
  .btn-primary:hover{background:#2A2520}
  .btn-secondary{background:#fff;color:#44403C;border:1px solid #E7E5E4}
  .btn-secondary:hover{border-color:#D6D3D1;background:#FAFAF9}
  .btn-tertiary{background:#F5F5F4;color:#57534E;border:1px solid transparent}
  .btn-tertiary:hover{background:#E7E5E4;color:#292524}
  .btn-danger-soft{background:#F6EDEA;color:#B0554A;border:1px solid transparent}
  .btn-danger-soft:hover{background:#EFE2DE}
  .btn-wa{background:#25D366;color:#fff}
  .btn-wa:hover{background:#1DA851}
  .wa-btn,.wa-btn-sm{display:inline-flex;align-items:center;gap:.3rem;background:#25D366;color:#fff;font-weight:700;border:none;border-radius:.5rem;cursor:pointer;white-space:nowrap}
  .wa-btn{padding:.45rem .75rem;font-size:12px}
  .wa-btn-sm{padding:.3rem .55rem;font-size:10.5px;border-radius:.375rem}
  .wa-btn:hover,.wa-btn-sm:hover{background:#1DA851}
  .btn-ghost{display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .6rem;border-radius:.5rem;font-size:12px;font-weight:600;color:#57534E;background:transparent;border:1px solid transparent;cursor:pointer;transition:background .12s}
  .btn-ghost:hover{background:#F5F5F4;color:#1C1917}
  .pill{padding:.4rem .9rem;border-radius:9999px;font-size:12px;font-weight:600;border:1px solid #E7E5E4;background:#fff;color:#57534E;cursor:pointer;white-space:nowrap;transition:all .12s}
  .pill:hover{border-color:#D6D3D1}
  .pill.active{background:#3F3A34;border-color:#3F3A34;color:#fff}
  .f-input{width:100%;padding:.625rem .875rem;background:#fff;border:1px solid rgba(231,229,228,.7);border-radius:.75rem;font-size:13px;color:#1C1917}
  .f-input:disabled{background:#F5F5F4;color:#78716C}
</style>

<script>
/* ============================================================
   HELPERS
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el=id=>document.getElementById(id);
const rupiah=n=>'Rp'+Math.round(Number(n)||0).toLocaleString('id-ID');
const clampNum=n=>{const x=parseFloat(n);return(isNaN(x)||x<0)?0:x};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

function toast(msg,type){
  const t=document.createElement('div');
  const map={
    ok:   'border-l-4 border-sage bg-white text-ink-900',
    err:  'border-l-4 border-terra bg-white text-ink-900',
    wa:   'border-l-4 border-wa bg-white text-ink-900',
    '':   'border-l-4 border-accent bg-white text-ink-900'
  };
  const icon={
    ok:  '<i class="fa-solid fa-circle-check text-sage"></i>',
    err: '<i class="fa-solid fa-circle-exclamation text-terra"></i>',
    wa:  '<i class="fa-brands fa-whatsapp text-wa"></i>',
    '':  '<i class="fa-solid fa-circle-info text-accent"></i>'
  };
  t.className='flex items-start gap-3 px-4 py-3 rounded-xl shadow-card text-[13px] font-medium animate-slide-up '+(map[type]||map['']);
  t.innerHTML=`<span class="mt-0.5 text-[13px] flex-shrink-0">${icon[type]||icon['']}</span><span class="leading-snug">${esc(msg)}</span>`;
  el('toasts').appendChild(t);
  setTimeout(()=>{try{t.remove()}catch(_){}},3400);
}
const confirmAction=msg=>window.confirm(msg);

/* ============================================================
   DATE ENGINE
   ============================================================ */
const MS=86400000;
function parseISO(iso){
  if(!iso)return null;
  const p=String(iso).split('-').map(Number);
  if(p.length!==3||p.some(isNaN))return null;
  return new Date(p[0],p[1]-1,p[2],12);
}
const toISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
const addDays=(d,n)=>{const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x};
function addMonthsClamped(date,n){
  const t=date.getMonth()+n,y=date.getFullYear()+Math.floor(t/12),m=((t%12)+12)%12;
  return new Date(y,m,Math.min(date.getDate(),daysInMonth(y,m)),12);
}
const diffDays=(a,b)=>Math.round((b.getTime()-a.getTime())/MS);
function calculateRentalEndDate(startISO,value,unit){
  const start=parseISO(startISO);
  if(!start||!value||value<=0)return null;
  let end,anniversary=null;
  if(unit==='day')end=addDays(start,value-1);
  else if(unit==='week')end=addDays(start,value*7-1);
  else if(unit==='month'){anniversary=addMonthsClamped(start,value);end=addDays(anniversary,-1)}
  else return null;
  return{start,end,anniversary,totalDays:diffDays(start,end)+1,value,unit};
}
function formatTanggalID(x,withDay){
  const d=typeof x==='string'?parseISO(x):x;
  if(!d)return'-';
  const b=`${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
  return withDay?`${HARI[d.getDay()]}, ${b}`:b;
}
function formatTanggalShort(x){
  const d=typeof x==='string'?parseISO(x):x;
  return d?`${d.getDate()} ${BULAN[d.getMonth()].slice(0,3)} ${d.getFullYear()}`:'-';
}
function formatDateTimeID(iso){
  const d=new Date(iso);
  if(isNaN(d))return'-';
  return `${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
const formatDurasi=(v,u)=>v?`${v} ${({day:'Hari',week:'Minggu',month:'Bulan'})[u]||u}`:'-';

/* ============================================================
   TRANSAKSI
   ============================================================ */
const TX={
  rent:{label:'Sewa',kind:'payment',icon:'fa-money-bill-wave'},
  dp:{label:'DP',kind:'payment',icon:'fa-hand-holding-dollar'},
  deposit:{label:'Deposit',kind:'deposit',icon:'fa-lock'},
  extra:{label:'Biaya Tambahan',kind:'charge',icon:'fa-plus-circle'},
  late_fee:{label:'Denda',kind:'charge',icon:'fa-clock-rotate-left'},
  refund:{label:'Refund',kind:'refund',icon:'fa-rotate-left'}
};
const EXTRA_SUBTYPES=['Listrik','Air','Wi-Fi','Parkir','Laundry','Fasilitas','Kebersihan','Lainnya'];
const METHODS=['Transfer Bank','Cash','QRIS','E-Wallet','Lainnya'];
const MIGRATE_TX={
  settlement:'rent',installment:'rent',electricity:'extra',water:'extra',wifi:'extra',
  parking:'extra',laundry:'extra',facility:'extra',deposit_refund:'refund',
  deposit_deduction:'refund',correction:'extra'
};

const BADGE={

/* ============================================================

let _persistTimer=null;
function persist(){
  clearTimeout(_persistTimer);
  _persistTimer=setTimeout(()=>{
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify({
        rooms:state.rooms,tenants:state.tenants,rentals:state.rentals,
        transactions:state.transactions,waHistory:state.waHistory,
        counters:state.counters,settings:state.settings,
        todayISO:toISO(state.today),savedAt:new Date().toISOString()
      }));
    }catch(e){console.warn('Persist gagal:',e)}
  },200);
}
function persistWA(){try{localStorage.setItem(WA_KEY,JSON.stringify(state.waHistory))}catch(e){}}
function migrateData(d){
  if(Array.isArray(d.transactions)){
    d.transactions.forEach(t=>{
      if(t&&t.type&&MIGRATE_TX[t.type])t.type=MIGRATE_TX[t.type];
      if(!t.transactionDate)t.transactionDate=toISO(new Date());
      if(!t.paymentMethod)t.paymentMethod='Transfer Bank';
      if(typeof t.amount!=='number')t.amount=Number(t.amount)||0;
    });
  }
  if(Array.isArray(d.rooms))d.rooms.forEach(r=>{delete r.pricingPlans});
  if(Array.isArray(d.rentals))d.rentals.forEach(r=>{if(!Array.isArray(r.logs))r.logs=[]});
  if(!Array.isArray(d.waHistory))d.waHistory=[];
  return d;
}
function loadPersisted(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return false;
    let d=JSON.parse(raw);
    if(!d||!Array.isArray(d.rooms))return false;
    d=migrateData(d);
    state.rooms=d.rooms||[];
    state.tenants=Array.isArray(d.tenants)?d.tenants:[];
    state.rentals=Array.isArray(d.rentals)?d.rentals:[];
    state.transactions=Array.isArray(d.transactions)?d.transactions:[];
    state.waHistory=Array.isArray(d.waHistory)?d.waHistory:[];
    state.counters=d.counters||{};
    state.settings=Object.assign({lateFeePerDay:20000},d.settings||{});
    /* FIX (bug): selalu pakai tanggal sistem — todayISO tersimpan membuat
       status "Terlambat/Aktif" membeku di tanggal terakhir save */
    const n=new Date();
    state.today=new Date(n.getFullYear(),n.getMonth(),n.getDate(),12);
    /* FIX (bug): reportMonth ikut di-restore saat load data tersimpan */
    state.reportMonth={year:state.today.getFullYear(),month:state.today.getMonth()};
    return true;
  }catch(e){console.error('Load gagal:',e);return false}
}

function downloadCSV(filename,rows){
  const csv=rows.map(row=>row.map(c=>{
    const s=String(c==null?'':c);
    return/[",\n\r]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;
  }).join(',')).join('\r\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  toast('CSV berhasil diunduh','ok');
}
function importData(file){
  const rd=new FileReader();
  rd.onload=e=>{
    const txt=e.target.result;
    const isJSON=file.name.toLowerCase().endsWith('.json')||txt.trim().startsWith('{');
    if(isJSON){
      try{
        let d=JSON.parse(txt);
        if(!Array.isArray(d.rooms)||!Array.isArray(d.tenants))throw new Error('Format tidak valid');
        if(!confirmAction('Import akan MENGGANTI seluruh data saat ini. Lanjutkan?'))return;
        d=migrateData(d);
        state.rooms=d.rooms;state.tenants=d.tenants;
        state.rentals=d.rentals||[];state.transactions=d.transactions||[];
        state.waHistory=d.waHistory||[];state.counters=d.counters||{};
        state.settings=Object.assign({lateFeePerDay:20000},d.settings||{});
        persist();persistWA();render();
        toast('Data JSON berhasil diimport','ok');
      }catch(err){toast('Gagal import JSON: '+err.message,'err')}
    }else{
      try{
        const lines=txt.split(/\r?\n/).filter(l=>l.trim());
        if(lines.length<1)throw new Error('CSV kosong');
        const first=lines[0].toLowerCase();
        const startIdx=/nama|name/.test(first)?1:0;
        let added=0;
        for(let i=startIdx;i<lines.length;i++){
          const cols=lines[i].split(',').map(s=>s.trim().replace(/^"|"$/g,''));
          if(!cols[0])continue;
          state.tenants.push({id:nextId('TNT'),name:cols[0],phone:cols[1]||'-',notes:cols[2]||''});
          added++;
        }
        persist();render();
        toast(added+' penyewa ditambahkan dari CSV','ok');
      }catch(err){toast('Gagal import CSV: '+err.message,'err')}
    }
  };
  rd.readAsText(file);
}

   BILLING
   ============================================================ */
function calculateBilling(rental){
  const txs=state.transactions.filter(t=>t.rentalId===rental.id);
  const sum=k=>txs.filter(t=>(TX[t.type]||{}).kind===k).reduce((s,t)=>s+(Number(t.amount)||0),0);
  const totalDibayar=sum('payment');
  const biayaTambahan=sum('charge');
  const depositMasuk=sum('deposit');
  const refund=sum('refund');
  const totalTagihan=rental.totalPrice+biayaTambahan;
  return{transactions:txs,totalSewa:rental.totalPrice,biayaTambahan,totalTagihan,totalDibayar,sisa:Math.max(0,totalTagihan-totalDibayar),depositMasuk,refund};
}
function getPaymentStatus(b){
  if(b.totalTagihan<=0)return{label:'—',tone:'muted'};
  if(b.sisa<=0)return{label:'Lunas',tone:'success'};
  if(b.totalDibayar>0)return{label:'DP',tone:'warning'};
  return{label:'Belum Bayar',tone:'danger'};
}

/* ============================================================
   STATUS ENGINE
   ============================================================ */
function calculateLateDays(r,today){
  today=today||state.today;
  const e=parseISO(r.endDate);
  if(!e)return 0;
  const l=diffDays(e,today);
  return l>0?l:0;
}
function calculateLateFee(r,today){
  const days=calculateLateDays(r,today);
  return{days,amount:days*state.settings.lateFeePerDay};
}
function getRentalStatus(r,today){
  today=today||state.today;
  if(r.status==='cancelled')return{code:'cancelled',label:'Dibatalkan',tone:'muted'};
  if(r.status==='finished')return{code:'finished',label:'Selesai',tone:'muted'};
  const s=parseISO(r.startDate),e=parseISO(r.endDate);
  if(!s||!e)return{code:'unknown',label:'—',tone:'muted'};
  if(today<s){const d=diffDays(today,s);return{code:'upcoming',label:`Booking · ${d} hari lagi`,tone:'info',daysToStart:d}}
  if(today<e){const d=diffDays(today,e);return{code:'active',label:`Aktif · ${d} hari lagi`,tone:'success',remainingDays:d}}
  if(today.getTime()===e.getTime())return{code:'lastday',label:'Jatuh tempo hari ini',tone:'warning',remainingDays:0};
  const late=diffDays(e,today);
  return{code:'overdue',label:`Terlambat ${late} hari`,tone:'danger',lateDays:late};
}
function getRoomDisplayStatus(room,today){
  today=today||state.today;
  if(room.manualStatus==='maintenance')return{code:'maintenance',label:'Maintenance',tone:'muted'};
  const rs=state.rentals.filter(r=>r.roomId===room.id&&r.status!=='cancelled'&&r.status!=='finished');
  const active=rs.find(r=>parseISO(r.startDate)<=today&&today<=parseISO(r.endDate));
  if(active)return{code:'terisi',label:'Terisi',tone:'success',rental:active};
  const up=rs.filter(r=>parseISO(r.startDate)>today).sort((a,b)=>a.startDate.localeCompare(b.startDate))[0];
  if(up)return{code:'booking',label:'Booking',tone:'info',rental:up};
  return{code:'kosong',label:'Kosong',tone:'muted'};
}
const DUE_SOON_DAYS=7;
function getTaskList(today){
  today=today||state.today;
  const tasks={urgent:[],warning:[],info:[]};
  state.rentals.forEach(r=>{
    if(r.status==='cancelled'||r.status==='finished')return;
    const st=getRentalStatus(r,today);const b=calculateBilling(r);
    if(st.code==='overdue')tasks.urgent.push({rental:r,st,b,reason:`Terlambat ${st.lateDays} hari`});
    else if(st.code==='lastday')tasks.urgent.push({rental:r,st,b,reason:'Jatuh tempo hari ini'});
    else if(st.code==='active'&&st.remainingDays<=DUE_SOON_DAYS)tasks.warning.push({rental:r,st,b,reason:`Jatuh tempo ${st.remainingDays} hari lagi`});
    else if(st.code==='upcoming'&&st.daysToStart<=DUE_SOON_DAYS)tasks.info.push({rental:r,st,b,reason:`Mulai ${st.daysToStart} hari lagi`});
  });
  tasks.urgent.sort((a,b)=>a.rental.endDate.localeCompare(b.rental.endDate));
  tasks.warning.sort((a,b)=>a.rental.endDate.localeCompare(b.rental.endDate));
  tasks.info.sort((a,b)=>a.rental.startDate.localeCompare(b.rental.startDate));
  return tasks;
}
function checkRentalConflict(roomId,sISO,eISO,excl){
  const s=parseISO(sISO),e=parseISO(eISO);
  if(!s||!e)return null;
  return state.rentals.find(r=>r.roomId===roomId&&r.id!==excl&&r.status!=='cancelled'&&r.status!=='finished'&&s<=parseISO(r.endDate)&&parseISO(r.startDate)<=e)||null;
}

  if(st.code==='overdue')L.push(`Kami dari manajemen kos ingin mengingatkan bahwa masa sewa kamar *${room?room.name:rental.roomId}* Anda *TELAH TERLAMBAT ${st.lateDays} hari* (berakhir ${formatTanggalID(rental.endDate)}).`);
  else if(st.code==='lastday')L.push(`Kami dari manajemen kos ingin mengingatkan bahwa masa sewa kamar *${room?room.name:rental.roomId}* Anda berakhir *HARI INI* (${formatTanggalID(rental.endDate)}).`);
  else if(st.code==='active')L.push(`Kami dari manajemen kos ingin mengingatkan bahwa masa sewa kamar *${room?room.name:rental.roomId}* Anda akan berakhir dalam *${st.remainingDays} hari* pada *${formatTanggalID(rental.endDate,true)}*.`);
  else if(st.code==='upcoming')L.push(`Kami dari manajemen kos ingin mengingatkan bahwa masa sewa kamar *${room?room.name:rental.roomId}* Anda akan dimulai dalam *${st.daysToStart} hari* pada *${formatTanggalID(rental.startDate,true)}*.`);
  L.push('');L.push('Rincian Tagihan:');
  L.push(`• Periode: ${formatTanggalID(rental.startDate)} – ${formatTanggalID(rental.endDate)}`);
  L.push(`• Total tagihan: ${rupiah(b.totalTagihan)}`);
  L.push(`• Sudah dibayar: ${rupiah(b.totalDibayar)}`);
  L.push(`• *Sisa tagihan: ${rupiah(b.sisa)}*`);
  if(st.code==='overdue'&&b.sisa>0){
    const lf=calculateLateFee(rental);
    L.push(`• Denda: ${rupiah(lf.amount)} (${lf.days} hari x ${rupiah(state.settings.lateFeePerDay)})`);
    L.push(`• *Total perlu dibayar: ${rupiah(b.sisa+lf.amount)}*`);
  }
  L.push('');
  L.push(st.code==='upcoming'?'Mohon konfirmasi kehadiran Anda. Terima kasih.':'Mohon konfirmasi untuk pembayaran atau perpanjangan sewa. Terima kasih.');
  return L.join('\n');
}

/* ============================================================
   BULK WA
   ============================================================ */
const bulkState={running:false,stop:false,index:0,rows:[],total:0};
function startBulkWA(){
  const tasks=getTaskList();
  const rows=[...tasks.urgent,...tasks.warning];
  if(!rows.length)return toast('Tidak ada yang perlu diingatkan','ok');
  const withPhone=rows.filter(x=>{const t=getTenant(x.rental.tenantId);return t&&cleanPhone(t.phone)});
  const noPhone=rows.length-withPhone.length;
  if(!withPhone.length)return toast('Semua penyewa belum punya nomor HP','err');
  const msg=`Kirim pengingat WhatsApp ke ${withPhone.length} penyewa?`+
    (noPhone?`\n\n(${noPhone} penyewa dilewati karena tanpa nomor HP)`:'')+
    `\n\nTab WhatsApp akan terbuka otomatis. Izinkan pop-up di browser Anda.`;
  if(!confirmAction(msg))return;
  bulkState.running=true;bulkState.stop=false;bulkState.index=0;
  bulkState.rows=withPhone;bulkState.total=withPhone.length;
  el('bulkPanel').classList.remove('hidden');
  updateBulkUI();
  runBulkNext();
}
function updateBulkUI(){
  const{index,total,rows}=bulkState;
  el('bulkCount').textContent=`${index} / ${total}`;
  if(index<total){
    const t=getTenant(rows[index].rental.tenantId);
    el('bulkLabel').textContent=`Mengirim ke ${t?t.name:''}...`;
  }else el('bulkLabel').textContent='Selesai';
  el('bulkBar').style.width=(total?(index/total*100):0)+'%';
}
function runBulkNext(){
  if(bulkState.stop||bulkState.index>=bulkState.total){finishBulk();return}
  const item=bulkState.rows[bulkState.index];
  const t=getTenant(item.rental.tenantId);
  const phone=cleanPhone(t?t.phone:'');
  if(!phone){bulkState.index++;updateBulkUI();setTimeout(runBulkNext,300);return}
  const msg=buildReminderMessage(item.rental);
  const url=`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
  const ok=openWA(url);
  /* FIX: jika popup diblokir, hentikan bulk & jangan catat sebagai terkirim */
  if(!ok){bulkState.stop=true;finishBulk();return}
  logWASent(item.rental,msg);
  bulkState.index++;updateBulkUI();
  setTimeout(runBulkNext,1800);
}
function stopBulk(){bulkState.stop=true;toast('Dihentikan oleh admin','')}
function finishBulk(){
  bulkState.running=false;
  toast(`Selesai — ${bulkState.index} pesan diproses`,'wa');
  render();
  setTimeout(()=>{el('bulkPanel').classList.add('hidden');el('bulkBar').style.width='0'},2000);
}

/* ============================================================
   VIEW: LAPORAN
   ============================================================ */
function viewReports(){
  const rm=state.reportMonth;
  const ms=new Date(rm.year,rm.month,1,12);
  const me=new Date(rm.year,rm.month+1,0,12);
  const msISO=toISO(ms),meISO=toISO(me);
  const label=`${BULAN[rm.month]} ${rm.year}`;
  const inMonthTx=state.transactions.filter(t=>{const d=parseISO(t.transactionDate);return!!d&&d>=ms&&d<=me});
  const KIND_LABEL={payment:'Pembayaran (Sewa/DP)',deposit:'Deposit',charge:'Biaya Tambahan & Denda',refund:'Refund'};
  const rekap=['payment','deposit','charge','refund'].map(k=>{
    const arr=inMonthTx.filter(t=>(TX[t.type]||{}).kind===k);
    return{k,n:arr.length,total:arr.reduce((s,t)=>s+(Number(t.amount)||0),0)};
  });
  const bills=state.rentals
    .filter(r=>r.status!=='cancelled'&&r.startDate<=meISO&&r.endDate>=msISO)
    .map(r=>({r,b:calculateBilling(r),st:getRentalStatus(r)}))
    .sort((a,b)=>a.r.endDate.localeCompare(b.r.endDate));
  const totTagih=bills.reduce((s,x)=>s+x.b.totalTagihan,0);
  const totBayar=bills.reduce((s,x)=>s+x.b.totalDibayar,0);
  const totSisa=bills.reduce((s,x)=>s+x.b.sisa,0);
  const rekapRows=rekap.map(x=>`<tr class="table-row border-t border-ink-200/60">
    ${td(`<span class="text-[12.5px] font-medium text-ink-800">${KIND_LABEL[x.k]}</span>`)}
    ${td(`<span class="text-[12.5px] text-ink-600 tabular-nums">${x.n}x</span>`)}
    ${td(`<span class="text-[12.5px] font-semibold tabular-nums">${rupiah(x.total)}</span>`,'text-right')}
  </tr>`).join('');
  const billRows=bills.map(({r,b,st})=>`<tr class="table-row border-t border-ink-200/60 hover:bg-ink-100/40">
    ${td(`<div class="text-[12.5px] font-medium text-ink-800">${esc((getRoom(r.roomId)||{}).name||r.roomId)}</div>`)}
    ${td(`<div class="text-[12.5px] font-semibold text-ink-900">${esc(tenantName(r.tenantId))}</div>`)}
    ${td(`<span class="text-[12px] text-ink-600 tabular-nums whitespace-nowrap">${formatTanggalShort(r.startDate)} – ${formatTanggalShort(r.endDate)}</span>`)}
    ${td(`<span class="text-[12.5px] tabular-nums">${rupiah(b.totalTagihan)}</span>`)}
    ${td(`<span class="text-[12.5px] tabular-nums text-sage">${rupiah(b.totalDibayar)}</span>`)}
    ${td(`<span class="text-[12.5px] font-semibold tabular-nums ${b.sisa>0?'text-terra':'text-ink-400'}">${rupiah(b.sisa)}</span>`)}
    ${td(badge(st.tone,st.label))}
  </tr>`).join('');
  return `
  ${card(
    cardHead('Laporan — '+label,'Rekap bulanan siap export',
      `<button class="btn-secondary" data-action="report-prev" type="button" title="Bulan sebelumnya"><i class="fa-solid fa-chevron-left text-[11px]"></i></button>
       <button class="btn-secondary" data-action="report-next" type="button" title="Bulan berikutnya"><i class="fa-solid fa-chevron-right text-[11px]"></i></button>
       <button class="btn-primary" data-action="export-report" type="button"><i class="fa-solid fa-file-csv text-[11px]"></i> Export CSV</button>`)+
    `<div class="p-5 grid sm:grid-cols-3 gap-3">
      <div class="rounded-xl bg-ink-100 px-4 py-3"><div class="text-[10.5px] font-semibold text-ink-500 tracking-label uppercase">Total Tagihan</div><div class="text-[16px] font-bold text-ink-900 tabular-nums mt-1">${rupiah(totTagih)}</div></div>
      <div class="rounded-xl bg-sage-soft px-4 py-3"><div class="text-[10.5px] font-semibold text-ink-500 tracking-label uppercase">Terbayar</div><div class="text-[16px] font-bold text-sage tabular-nums mt-1">${rupiah(totBayar)}</div></div>
      <div class="rounded-xl bg-terra-soft px-4 py-3"><div class="text-[10.5px] font-semibold text-ink-500 tracking-label uppercase">Outstanding</div><div class="text-[16px] font-bold text-terra tabular-nums mt-1">${rupiah(totSisa)}</div></div>
    </div>`)}
  <div class="mt-5 grid lg:grid-cols-2 gap-5 items-start">
    ${card(cardHead('Rekap Transaksi',label)+tableWrap(`<table class="w-full">${th('Jenis','Jumlah','Total')}${rekapRows}</table>`))}
    ${card(cardHead('Tagihan Sewa',`${bills.length} periode aktif pada ${label}`)+(billRows?tableWrap(`<table class="w-full">${th('Kamar','Penyewa','Periode','Tagihan','Dibayar','Sisa','Status')}${billRows}</table>`):emptyState('fa-file-invoice','Tidak ada periode sewa pada bulan ini.')))}
  </div>`;
}

function saveTenant(id){

function saveRoom(id){
  const name=el('rfName').value.trim();
  const pm=clampNum(el('rfPrice').value);
  if(!name)return toast('Nama kamar wajib diisi','err');
  if(pm<=0)return toast('Harga bulanan harus lebih dari 0','err');
  let pw=clampNum(el('rfWeek').value),pd=clampNum(el('rfDay').value);
  if(!pw)pw=Math.round(pm/4.33/1000)*1000;
  if(!pd)pd=Math.round(pm/30/1000)*1000;
  const facilities=el('rfFac').value.trim();
  if(id){const r=getRoom(id);if(r){r.name=name;r.priceMonthly=pm;r.priceWeekly=pw;r.priceDaily=pd;r.facilities=facilities}}
  else state.rooms.push({id:nextId('RM'),name,priceMonthly:pm,priceWeekly:pw,priceDaily:pd,manualStatus:null,facilities});
  persist();closeModal();render();
  toast(id?'Kamar diperbarui':'Kamar ditambahkan','ok');
}

function autoPrice(roomId,value,unit){
  const room=getRoom(roomId);if(!room)return 0;
  const v=clampNum(value);if(!v)return 0;
  if(unit==='month')return v*room.priceMonthly;
  if(unit==='week')return v*room.priceWeekly;
  return v*room.priceDaily;
}

let _rentalPriceTouched=false;
function openRentalForm(rentalId,preset){
  preset=preset||{};
  const editing=rentalId?getRental(rentalId):null;
  const roomId=editing?editing.roomId:(preset.roomId||(state.rooms[0]||{}).id||'');
  const tenantId=editing?editing.tenantId:(preset.tenantId||'');
  const startISO=editing?editing.startDate:toISO(state.today);
  const dv=editing?editing.durationValue:1;
  const du=editing?editing.durationUnit:'month';
  _rentalPriceTouched=!!editing;
  const roomOpts=state.rooms.map(r=>[r.id,`${r.name} — ${rupiah(r.priceMonthly)}/bln`]);
  const tenantOpts=[['','— Pilih Penyewa —'],...state.tenants.map(t=>[t.id,t.name]),['__new','+ Penyewa Baru']];
  openModal(
    modalHeader(editing?'Edit Periode Sewa':'Tambah Periode Sewa',
      editing?`${esc(tenantName(editing.tenantId))} · ${esc((getRoom(editing.roomId)||{}).name||'')}`:'Buat kontrak sewa baru')+
    `<div class="p-6 grid sm:grid-cols-2 gap-4">
      ${fld('Kamar',`<select id="rfRoom" class="f-input">${roomOpts.map(o=>`<option value="${esc(o[0])}"${o[0]===roomId?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`)}
      ${fld('Tanggal Mulai',`<input id="rfStart" type="date" value="${esc(startISO)}" class="f-input">`)}
      ${fld('Penyewa',`<select id="rfTenant" class="f-input">${tenantOpts.map(o=>`<option value="${esc(o[0])}"${o[0]===tenantId?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`)}
      <div class="flex items-end">
        <div id="rfPreview" class="w-full text-[12px] rounded-xl px-4 py-3 bg-accent-soft border border-accent-ring/40 text-ink-700 leading-snug"></div>
      </div>
      <div id="rfNewTenant" class="${tenantId==='__new'?'':'hidden'} grid grid-cols-2 gap-3 sm:col-span-2">
        ${fld('Nama Penyewa Baru',`<input id="rfNewName" class="f-input" placeholder="Nama lengkap">`)}
        ${fld('No. WhatsApp',`<input id="rfNewPhone" class="f-input" placeholder="08xx">`)}
      </div>
      <div class="grid grid-cols-2 gap-3 sm:col-span-2">
        ${fld('Durasi',`<input id="rfDur" type="number" min="1" value="${dv}" class="f-input">`)}
        ${fld('Satuan',`<select id="rfUnit" class="f-input">
          <option value="day"${du==='day'?' selected':''}>Hari</option>
          <option value="week"${du==='week'?' selected':''}>Minggu</option>
          <option value="month"${du==='month'?' selected':''}>Bulan</option></select>`)}
      </div>
      ${fld('Harga Total (Rp)',`<input id="rfPrice" type="number" min="0" step="1000" value="${editing?editing.totalPrice:''}" class="f-input" placeholder="Otomatis dari harga kamar">`)}
    </div>
    <div class="px-6 py-4 border-t border-ink-200/60 bg-ink-100/40 flex justify-end gap-2">
      <button class="btn-secondary" data-action="close-modal" type="button">Batal</button>
      <button class="btn-primary" data-action="save-rental" data-id="${rentalId||''}" type="button">${editing?'Simpan Perubahan':'Buat Sewa'}</button>
    </div>`,'lg'
  );
  const upd=()=>updateRentalForm(editing?editing.id:'');
  ['rfRoom','rfStart','rfDur','rfUnit'].forEach(id2=>{
    const n=el(id2);
    if(n){n.addEventListener('change',upd);n.addEventListener('input',upd)}
  });
  el('rfPrice').addEventListener('input',()=>{_rentalPriceTouched=true});
  el('rfTenant').addEventListener('change',()=>{
    el('rfNewTenant').classList.toggle('hidden',el('rfTenant').value!=='__new');
  });
  upd();
}
function updateRentalForm(excludeId){
  const roomId=el('rfRoom').value,start=el('rfStart').value;
  const v=parseInt(el('rfDur').value,10)||0,u=el('rfUnit').value;
  const room=getRoom(roomId);
  if(!_rentalPriceTouched&&room)el('rfPrice').value=autoPrice(roomId,v,u)||'';
  const p=calculateRentalEndDate(start,v,u);
  const pv=el('rfPreview');
  if(!p){pv.innerHTML='<i class="fa-solid fa-circle-info mr-1.5"></i>Isi tanggal mulai & durasi untuk melihat periode.';return}
  const conf=checkRentalConflict(roomId,start,toISO(p.end),excludeId||null);
  pv.innerHTML=`<i class="fa-solid fa-calendar-check mr-1.5 text-accent"></i>Berakhir <strong>${formatTanggalID(toISO(p.end),true)}</strong> (${p.totalDays} hari)`
    +(conf?`<div class="mt-1.5 text-terra font-semibold"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Bentrok dengan ${esc(tenantName(conf.tenantId))} (${formatTanggalShort(conf.startDate)}–${formatTanggalShort(conf.endDate)})</div>`:'');
}
function saveRental(rentalId){
  const roomId=el('rfRoom').value;
  const start=el('rfStart').value;
  const v=parseInt(el('rfDur').value,10)||0;
  const u=el('rfUnit').value;
  const price=clampNum(el('rfPrice').value);
  let tenantId=el('rfTenant').value;
  if(!roomId)return toast('Pilih kamar','err');
  if(!parseISO(start))return toast('Tanggal mulai tidak valid','err');
  if(v<=0)return toast('Durasi harus lebih dari 0','err');
  const p=calculateRentalEndDate(start,v,u);
  if(!p)return toast('Periode tidak valid','err');
  const conf=checkRentalConflict(roomId,start,toISO(p.end),rentalId||null);
  if(conf)return toast(`Bentrok jadwal dengan ${tenantName(conf.tenantId)} (${formatTanggalShort(conf.startDate)}–${formatTanggalShort(conf.endDate)})`,'err');
  if(tenantId==='__new'){
    const name=el('rfNewName').value.trim();
    if(!name)return toast('Nama penyewa baru wajib diisi','err');
    const nt={id:nextId('TNT'),name,phone:el('rfNewPhone').value.trim()||'-',notes:''};
    state.tenants.push(nt);tenantId=nt.id;
  }else if(!tenantId||!getTenant(tenantId))return toast('Pilih penyewa','err');
  if(price<=0)return toast('Harga total harus lebih dari 0','err');
  if(rentalId){
    const r=getRental(rentalId);if(!r)return;
    Object.assign(r,{roomId,tenantId,startDate:start,endDate:toISO(p.end),durationValue:v,durationUnit:u,totalPrice:price});
    r.logs=r.logs||[];
    r.logs.push({date:toISO(state.today),type:'edit',text:'Data sewa diedit',by:'admin'});
  }else{
    const status=parseISO(start)>state.today?'booked':'active';
    state.rentals.push({id:nextId('RTL'),roomId,tenantId,startDate:start,endDate:toISO(p.end),
      durationValue:v,durationUnit:u,totalPrice:price,status,
      previousRentalId:null,availableDate:null,emptyDays:null,createdAt:toISO(state.today),logs:[]});
  }
  persist();closeModal();render();
  toast(rentalId?'Periode sewa diperbarui':'Periode sewa dibuat','ok');
}

function openRentalDetail(id){
  const r=getRental(id);if(!r)return;
  const room=getRoom(r.roomId);const b=calculateBilling(r);
  const st=getRentalStatus(r);const ps=getPaymentStatus(b);
  const txs=b.transactions.slice().sort((a,c)=>a.transactionDate.localeCompare(c.transactionDate));
  const rows=txs.map(t=>{
    const tx=TX[t.type]||{label:t.type,kind:'payment'};
    return `<tr class="table-row border-t border-ink-200/60">
      ${td(`<span class="text-[12px] text-ink-600 tabular-nums whitespace-nowrap">${formatTanggalShort(t.transactionDate)}</span>`)}
      ${td(badge(tx.kind==='payment'?'success':tx.kind==='deposit'?'info':tx.kind==='charge'?'warning':'danger',tx.label+(t.subtype?' · '+esc(t.subtype):'')))}
      ${td(`<span class="text-[12px] text-ink-500">${esc(t.notes||'')}</span>`)}
      ${td(`<span class="text-[12.5px] font-semibold tabular-nums whitespace-nowrap">${tx.kind==='refund'?'-':''}${rupiah(t.amount)}</span>`,'text-right')}
      ${td(`<button class="btn-ghost" data-action="del-tx" data-id="${t.id}" type="button" title="Hapus"><i class="fa-regular fa-trash-can text-[11px]"></i></button>`,'text-right')}
    </tr>`;
  }).join('');
  openModal(
    modalHeader(`${esc(tenantName(r.tenantId))} — ${esc(room?room.name:r.roomId)}`,
      `${formatTanggalID(r.startDate,true)} – ${formatTanggalID(r.endDate,true)} · ${formatDurasi(r.durationValue,r.durationUnit)}`)+
    `<div class="p-6 flex flex-col gap-5">
      <div class="flex items-center gap-2 flex-wrap">
        ${badge(st.tone,st.label)}
        ${badge(ps.tone,'Pembayaran: '+ps.label)}
        ${badge('muted','Sewa '+esc(r.id))}
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
        ${[['Total Sewa',rupiah(b.totalSewa),false],['Biaya Tambahan',rupiah(b.biayaTambahan),false],['Total Tagihan',rupiah(b.totalTagihan),false],['Sudah Dibayar',rupiah(b.totalDibayar),false],['Sisa Tagihan',rupiah(b.sisa),b.sisa>0],['Deposit',rupiah(b.depositMasuk),false]].map(x=>`
          <div class="rounded-xl px-4 py-3 ${x[2]?'bg-terra-soft':'bg-ink-100'}">
            <div class="text-[10.5px] font-semibold text-ink-500 tracking-label uppercase">${x[0]}</div>
            <div class="text-[14px] font-bold text-ink-900 tabular-nums mt-1">${x[1]}</div>
          </div>`).join('')}
      </div>
      <div>
        <div class="text-[11px] font-semibold text-ink-400 tracking-label uppercase mb-2">Riwayat Transaksi</div>
        ${rows?tableWrap(`<table class="w-full">${th('Tanggal','Jenis','Catatan','Jumlah','')}${rows}</table>`):`<div class="text-[12.5px] text-ink-400 py-4 text-center bg-ink-100 rounded-xl">Belum ada transaksi.</div>`}
      </div>
    </div>
    <div class="px-6 py-4 border-t border-ink-200/60 bg-ink-100/40 flex justify-between gap-2 flex-wrap">
      <div class="flex gap-2 flex-wrap">
        <button class="btn-tertiary" data-action="finish-rental" data-id="${r.id}" type="button"><i class="fa-solid fa-check text-[11px]"></i> Tandai Selesai</button>
        <button class="btn-tertiary" data-action="cancel-rental" data-id="${r.id}" type="button"><i class="fa-solid fa-ban text-[11px]"></i> Batalkan</button>
      </div>
      <div class="flex gap-2 flex-wrap">
        <button class="btn-secondary" data-action="add-tx" data-id="${r.id}" type="button"><i class="fa-solid fa-plus text-[11px]"></i> Transaksi</button>
        <button class="btn-secondary" data-action="edit-rental" data-id="${r.id}" type="button"><i class="fa-solid fa-pen text-[11px]"></i> Edit</button>
        <button class="btn-wa" data-action="preview-wa" data-id="${r.id}" type="button"><i class="fa-brands fa-whatsapp"></i> WA</button>
      </div>
    </div>`,'lg'
  );
}

function openTxForm(rentalId){
  const r=getRental(rentalId);if(!r)return;
  openModal(
    modalHeader('Tambah Transaksi',`${esc(tenantName(r.tenantId))} — ${esc((getRoom(r.roomId)||{}).name||'')}`)+
    `<div class="p-6 grid sm:grid-cols-2 gap-4">
      ${fld('Jenis',`<select id="txType" class="f-input">${Object.keys(TX).map(k=>`<option value="${k}">${TX[k].label}</option>`).join('')}</select>`)}
      ${fld('Sub-Jenis (untuk Biaya Tambahan)',`<select id="txSub" class="f-input"><option value="">—</option>${EXTRA_SUBTYPES.map(s=>`<option>${s}</option>`).join('')}</select>`)}
      ${fld('Jumlah (Rp)',`<input id="txAmount" type="number" min="0" step="1000" class="f-input" placeholder="0">`)}
      ${fld('Tanggal',`<input id="txDate" type="date" value="${toISO(state.today)}" class="f-input">`)}
      ${fld('Metode Pembayaran',`<select id="txMethod" class="f-input">${METHODS.map(m=>`<option>${m}</option>`).join('')}</select>`)}
      ${fld('Catatan',`<input id="txNotes" class="f-input" placeholder="Opsional">`)}
    </div>
    <div class="px-6 py-4 border-t border-ink-200/60 bg-ink-100/40 flex justify-end gap-2">
      <button class="btn-secondary" data-action="close-modal" type="button">Batal</button>
      <button class="btn-primary" data-action="save-tx" data-id="${r.id}" type="button">Simpan</button>
    </div>`,'md'
  );
  setTimeout(()=>{const n=el('txAmount');if(n)n.focus()},50);
}
function saveTx(rentalId){
  const r=getRental(rentalId);if(!r)return;
  const type=el('txType').value;
  const amount=clampNum(el('txAmount').value);
  if(amount<=0)return toast('Jumlah harus lebih dari 0','err');
  state.transactions.push({id:nextId('TRX'),rentalId:r.id,tenantId:r.tenantId,roomId:r.roomId,
    type,subtype:type==='extra'?(el('txSub').value||''):'',amount,
    transactionDate:el('txDate').value||toISO(state.today),
    paymentMethod:el('txMethod').value,notes:el('txNotes').value.trim(),status:'posted'});
  persist();openRentalDetail(r.id);render();
  toast('Transaksi dicatat','ok');
}
function deleteTx(txId){
  const i=state.transactions.findIndex(t=>t.id===txId);
  if(i<0)return;
  const t=state.transactions[i];
  if(!confirmAction(`Hapus transaksi ${TX[t.type]?TX[t.type].label:t.type} sebesar ${rupiah(t.amount)}?`))return;
  state.transactions.splice(i,1);persist();
  if(!el('modalBackdrop').hidden&&t.rentalId&&getRental(t.rentalId))openRentalDetail(t.rentalId);
  render();
  toast('Transaksi dihapus','ok');
}

function setRentalStatus(id,status,label){
  const r=getRental(id);if(!r)return;
  if(!confirmAction(`${label} sewa ${tenantName(r.tenantId)} — ${(getRoom(r.roomId)||{}).name||''}?`))return;
  r.status=status;persist();closeModal();render();
  toast('Status sewa diperbarui','ok');
}

function openWADetail(waId){
  const w=state.waHistory.find(x=>x.id===waId);if(!w)return;
  openModal(
    modalHeader('Pesan WhatsApp',esc(w.tenantName||'')+' — '+formatDateTimeID(w.sentAt))+
    `<div class="p-6"><pre class="whitespace-pre-wrap font-mono text-[12.5px] bg-ink-100 rounded-xl p-4 leading-relaxed text-ink-800">${esc(w.message||'')}</pre></div>
    <div class="px-6 py-4 border-t border-ink-200/60 bg-ink-100/40 flex justify-end gap-2">
      <button class="btn-secondary" data-action="close-modal" type="button">Tutup</button>
      <button class="btn-wa" data-action="wa-resend" data-id="${w.id}" type="button"><i class="fa-brands fa-whatsapp"></i> Kirim Ulang</button>
    </div>`,'md'
  );
}

/* ============================================================
   EXPORT CSV
   ============================================================ */
function exportTransactionsCSV(){
  const rows=[['Tanggal','Penyewa','Kamar','Jenis','Metode','Jumlah','Catatan']];
  state.transactions.slice().sort((a,b)=>a.transactionDate.localeCompare(b.transactionDate)).forEach(t=>{
    rows.push([t.transactionDate,tenantName(t.tenantId),(getRoom(t.roomId)||{}).name||'',TX[t.type]?TX[t.type].label:t.type,t.paymentMethod||'',Number(t.amount)||0,t.notes||'']);
  });
  downloadCSV('transaksi-'+toISO(state.today)+'.csv',rows);
}
function exportReportCSV(){
  const rm=state.reportMonth;
  const msISO=toISO(new Date(rm.year,rm.month,1,12));
  const meISO=toISO(new Date(rm.year,rm.month+1,0,12));
  const rows=[['Kamar','Penyewa','Mulai','Selesai','Total Tagihan','Dibayar','Sisa','Status']];
  state.rentals.filter(r=>r.status!=='cancelled'&&r.startDate<=meISO&&r.endDate>=msISO).forEach(r=>{
    const b=calculateBilling(r);
    rows.push([(getRoom(r.roomId)||{}).name||r.roomId,tenantName(r.tenantId),r.startDate,r.endDate,b.totalTagihan,b.totalDibayar,b.sisa,getRentalStatus(r).label]);
  });
  downloadCSV(`laporan-${rm.year}-${String(rm.month+1).padStart(2,'0')}.csv`,rows);
}
function exportWACSV(){
  const rows=[['Waktu','Penyewa','Kamar','No HP','Sisa','Pesan']];
  state.waHistory.forEach(w=>rows.push([w.sentAt||'',w.tenantName||'',(getRoom(w.roomId)||{}).name||w.roomId||'',w.phone||'',w.sisa||0,w.message||'']));
  downloadCSV('riwayat-wa.csv',rows);
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
function switchView(v){
  state.activeView=v;
  if(state.q){state.q='';el('q').value='';el('qMobile').value=''}
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action],[data-view],[data-global]');
  if(!t)return;
  const id=t.dataset.id;
  if(t.dataset.view!==undefined){switchView(t.dataset.view);return}
  if(t.dataset.global!==undefined){
    if(t.dataset.global==='add-tenant')openTenantForm();
    else if(t.dataset.global==='new-rental')openRentalForm(null,id?{tenantId:id}:null);
    return;
  }
  switch(t.dataset.action){
    case 'close-modal':closeModal();break;
    case 'stop-bulk':stopBulk();break;
    case 'preview-wa':previewReminder(id);break;
    case 'send-wa-custom':sendWACustom(id);break;
    case 'edit-tenant':openTenantForm(id);break;
    case 'add-tenant':openTenantForm();break;
    case 'save-tenant':saveTenant(id||null);break;
    case 'add-room':openRoomForm();break;
    case 'edit-room':openRoomForm(id);break;
    case 'save-room':saveRoom(id||null);break;
    case 'toggle-maint':{
      const r=getRoom(id);
      if(r){r.manualStatus=r.manualStatus==='maintenance'?null:'maintenance';persist();render()}
      break;
    }
    case 'filter-rooms':state.filter.rooms=id;render();break;
    case 'filter-rentals':state.filter.rentals=id;render();break;
    case 'add-rental':openRentalForm();break;
    case 'edit-rental':openRentalForm(id);break;
    case 'save-rental':saveRental(id||null);break;
    case 'open-rental':openRentalDetail(id);break;
    case 'add-tx':openTxForm(id);break;
    case 'save-tx':saveTx(id);break;
    case 'del-tx':deleteTx(id);break;
    case 'finish-rental':setRentalStatus(id,'finished','Tandai selesai');break;
    case 'cancel-rental':setRentalStatus(id,'cancelled','Batalkan');break;
    case 'tenant-new-rental':openRentalForm(null,{tenantId:id});break;
    case 'bulk-wa':startBulkWA();break;
    case 'report-prev':case 'report-next':{
      const rm=state.reportMonth;
      const d=new Date(rm.year,rm.month+(t.dataset.action==='report-next'?1:-1),1,12);
      state.reportMonth={year:d.getFullYear(),month:d.getMonth()};
      render();break;
    }
    case 'export-tx':exportTransactionsCSV();break;
    case 'export-report':exportReportCSV();break;
    case 'export-data':exportData();break;
    case 'import-data':el('importFile').click();break;
    case 'reset-data':clearAllData();break;
    case 'save-settings':{
      state.settings.lateFeePerDay=clampNum(el('setLateFee').value);
      persist();toast('Pengaturan disimpan','ok');break;
    }
    case 'open-wa-detail':openWADetail(id);break;
    case 'wa-resend':{
      const w=state.waHistory.find(x=>x.id===id);
      if(w)openWA(`https://wa.me/${cleanPhone(w.phone)}?text=${encodeURIComponent(w.message||'')}`);
      break;
    }
    case 'clear-wa':
      if(confirmAction('Hapus seluruh riwayat WhatsApp?')){state.waHistory=[];persistWA();render();toast('Riwayat WA dihapus','ok')}
      break;
    case 'export-wa':exportWACSV();break;
    case 'open-help':openHelp();break;
  }
});

/* ============================================================
   INIT
   ============================================================ */
function bindStatic(){
  el('helpBtn').addEventListener('click',openHelp);
  el('helpBtnMobile').addEventListener('click',openHelp);
  el('exportBtn').addEventListener('click',exportData);
  el('exportBtnMobile').addEventListener('click',exportData);
  el('importBtn').addEventListener('click',()=>el('importFile').click());
  el('importFile').addEventListener('change',e=>{
    const f=e.target.files[0];
    if(f)importData(f);
    e.target.value='';
  });
  el('q').addEventListener('input',e=>{state.q=e.target.value;render()});
  el('qMobile').addEventListener('input',e=>{state.q=e.target.value;render()});
  el('modalBackdrop').addEventListener('click',e=>{if(e.target===el('modalBackdrop'))closeModal()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!el('modalBackdrop').hidden)closeModal()});
}

function init(){
  if(!loadPersisted())seedData();
  if(!state.reportMonth||!state.reportMonth.year){
    state.reportMonth={year:state.today.getFullYear(),month:state.today.getMonth()};
  }
  bindStatic();
  render();
}
init();
</script>
</body>
</html>
