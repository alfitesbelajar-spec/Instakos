<script>
tailwind.config = {

      colors: {
        canvas: '#FAF9F5',

        ink: { 900:'#1C1917',800:'#292524',700:'#44403C',600:'#57534E',500:'#78716C',400:'#A8A29E',300:'#D6D3D1',200:'#E7E5E4',100:'#F5F5F4' },
        accent:{ DEFAULT:'#3F3A34', hover:'#2A2520', soft:'#F2EFEA', ring:'#D9D3CA' },
        sage:  { DEFAULT:'#5B8266', soft:'#EDF3EE', ring:'#CFDDD3' },
        amber: { DEFAULT:'#B8873F', soft:'#F8F1E2', ring:'#E8D8B6' },
        terra: { DEFAULT:'#B0554A', soft:'#F6EDEA', ring:'#E5CCC6' },

      },

        'modal':'0 30px 80px -20px rgba(28,25,23,0.24)',

        'slide-up':'slideUp 200ms ease-out',

};

<style>

  .btn-lg{ padding:.85rem 1.35rem; font-size:14.5px; border-radius:1rem; }

  .wa-btn,.wa-btn-sm{display:inline-flex;align-items:center;gap:.3rem;background:#25D366;color:#fff;font-weight:700;border:none;border-radius:.6rem;cursor:pointer;white-space:nowrap}

  .pill:hover{border-color:#D6D3D1}

<script>
/* ============================================================
   HELPERS
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el=id=>document.getElementById(id);
const rupiah=n=>'Rp'+Math.round(Number(n)||0).toLocaleString('id-ID');
const clampNum=n=>{const x=parseFloat(n);return(isNaN(x)||x<0)?0:x};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

function toast(msg,type){
  const t=document.createElement('div');
  const map={
    ok:   'border-l-4 border-sage bg-white text-ink-900',
    err:  'border-l-4 border-terra bg-white text-ink-900',
    wa:   'border-l-4 border-wa bg-white text-ink-900',
    '':   'border-l-4 border-accent bg-white text-ink-900'
  };
  const icon={
    ok:  '<i class="fa-solid fa-circle-check text-sage"></i>',
    err: '<i class="fa-solid fa-circle-exclamation text-terra"></i>',
    wa:  '<i class="fa-brands fa-whatsapp text-wa"></i>',
    '':  '<i class="fa-solid fa-circle-info text-accent"></i>'
  };
  t.className='flex items-start gap-3 px-4 py-3 rounded-xl shadow-card text-[13px] font-medium animate-slide-up '+(map[type]||map['']);
  t.innerHTML=`<span class="mt-0.5 text-[13px] flex-shrink-0">${icon[type]||icon['']}</span><span class="leading-snug">${esc(msg)}</span>`;
  el('toasts').appendChild(t);
  setTimeout(()=>{try{t.remove()}catch(_){}},3400);
}
const confirmAction=msg=>window.confirm(msg);

/* ============================================================
   DATE ENGINE
   ============================================================ */
const MS=86400000;
function parseISO(iso){
  if(!iso)return null;
  const p=String(iso).split('-').map(Number);
  if(p.length!==3||p.some(isNaN))return null;
  return new Date(p[0],p[1]-1,p[2],12);
}
const toISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
const addDays=(d,n)=>{const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x};
function addMonthsClamped(date,n){
  const t=date.getMonth()+n,y=date.getFullYear()+Math.floor(t/12),m=((t%12)+12)%12;
  return new Date(y,m,Math.min(date.getDate(),daysInMonth(y,m)),12);
}
const diffDays=(a,b)=>Math.round((b.getTime()-a.getTime())/MS);
function calculateRentalEndDate(startISO,value,unit){
  const start=parseISO(startISO);
  if(!start||!value||value<=0)return null;
  let end;
  if(unit==='day')end=addDays(start,value-1);
  else if(unit==='week')end=addDays(start,value*7-1);
  else if(unit==='month')end=addDays(addMonthsClamped(start,value),-1);
  else return null;
  return{start,end,totalDays:diffDays(start,end)+1,value,unit};
}
function formatTanggalID(x,withDay){
  const d=typeof x==='string'?parseISO(x):x;
  if(!d)return'-';
  const b=`${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
  return withDay?`${HARI[d.getDay()]}, ${b}`:b;
}
function formatTanggalShort(x){
  const d=typeof x==='string'?parseISO(x):x;
  return d?`${d.getDate()} ${BULAN[d.getMonth()].slice(0,3)} ${d.getFullYear()}`:'-';
}
function formatDateTimeID(iso){
  const d=new Date(iso);
  if(isNaN(d))return'-';
  return `${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
const formatDurasi=(v,u)=>v?`${v} ${({day:'hari',week:'minggu',month:'bulan'})[u]||u}`:'-';
const formatDurasiPanjang=(v,u)=>v?`${v} ${({day:'hari',week:'minggu',month:'bulan'})[u]||u}`:'-';

/* ============================================================
   JENIS PEMBAYARAN (istilah awam)
   ============================================================ */
const TX={
  rent:{label:'Sewa',kind:'payment',icon:'fa-money-bill-wave'},
  dp:{label:'Uang Muka',kind:'payment',icon:'fa-hand-holding-dollar'},
  deposit:{label:'Deposit',kind:'deposit',icon:'fa-lock'},
  extra:{label:'Biaya Tambahan',kind:'charge',icon:'fa-plus-circle'},
  late_fee:{label:'Denda',kind:'charge',icon:'fa-clock-rotate-left'},
  refund:{label:'Pengembalian',kind:'refund',icon:'fa-rotate-left'}
};
const EXTRA_SUBTYPES=['Listrik','Air','Wi-Fi','Parkir','Laundry','Fasilitas','Kebersihan','Lainnya'];
const METHODS=['Transfer Bank','Cash','QRIS','E-Wallet','Lainnya'];
const MIGRATE_TX={
  settlement:'rent',installment:'rent',electricity:'extra',water:'extra',wifi:'extra',
  parking:'extra',laundry:'extra',facility:'extra',deposit_refund:'refund',
  deposit_deduction:'refund',correction:'extra'
};

const BADGE={
  success: 'bg-sage-soft text-sage ring-1 ring-sage-ring/40',
  warning: 'bg-amber-soft text-amber ring-1 ring-amber-ring/40',
  danger:  'bg-terra-soft text-terra ring-1 ring-terra-ring/40',
  info:    'bg-steel-soft text-steel ring-1 ring-steel-ring/40',
  muted:   'bg-ink-100 text-ink-500 ring-1 ring-ink-200/70',
  primary: 'bg-accent-soft text-accent ring-1 ring-accent-ring/50',
  wa:      'bg-wa-soft text-[#128C4A] ring-1 ring-wa/20'
};
const badge=(tone,content)=>`<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap ${BADGE[tone]||BADGE.muted}">${content}</span>`;

/* ============================================================
   STATE
   ============================================================ */
const STORAGE_KEY='kos-data-v4';
const WA_KEY='kos-wa-history-v1';
const ONBOARD_KEY='kos-onboard-v6';

const state={
  today:null,
  rooms:[],tenants:[],rentals:[],transactions:[],waHistory:[],
  counters:{},
  settings:{lateFeePerDay:20000},
  reportMonth:{year:0,month:0},
  activeView:'today',
  moneyTab:'pembayaran',
  settingsTab:'umum',
  q:'',
  filter:{rooms:'all',rentals:'all'}
};

function nextId(p){
  const k=p.toLowerCase();
  state.counters[k]=(state.counters[k]||0)+1;
  return`${p}-${String(state.counters[k]).padStart(4,'0')}`;
}

/* ============================================================
   SEED DATA (sama seperti sebelumnya)
   ============================================================ */
function genRooms(){
  const harga={'1A':1200000,'1B':1200000,'1C':1200000,'1D':1100000,'1E':1200000,'1F':1300000,'1G':1300000,'1H':1300000,'1I':1500000,'1J':1100000,'1K':1200000,'1L':1200000,'1M':1200000,'1N':1200000,'2A':1300000,'2B':1300000,'2C':1300000,'2D':1300000,'2E':1300000,'2F':1300000,'2G':1400000,'2H':1300000,'2I':1300000,'2J':1300000,'2K':1300000,'2L':1300000,'2M':1300000,'2N':1300000,'2O':1300000,'2P':1300000};
  return Object.keys(harga).map(id=>{
    const price=harga[id];
    return{id,name:`Kamar ${id}`,priceMonthly:price,priceWeekly:Math.round(price/4.33/1000)*1000,priceDaily:Math.round(price/30/1000)*1000,manualStatus:null,facilities:'AC, KM Dalam, Wi-Fi'};
  });
}
const TENANTS_SEED=[

let _persistTimer=null;
function persist(){
  clearTimeout(_persistTimer);
  _persistTimer=setTimeout(()=>{
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify({
        rooms:state.rooms,tenants:state.tenants,rentals:state.rentals,
        transactions:state.transactions,waHistory:state.waHistory,
        counters:state.counters,settings:state.settings,
        savedAt:new Date().toISOString()
      }));
    }catch(e){console.warn('Persist gagal:',e)}
  },200);
}
function persistWA(){try{localStorage.setItem(WA_KEY,JSON.stringify(state.waHistory))}catch(e){}}
function migrateData(d){
  if(Array.isArray(d.transactions)){
    d.transactions.forEach(t=>{
      if(t&&t.type&&MIGRATE_TX[t.type])t.type=MIGRATE_TX[t.type];
      if(!t.transactionDate)t.transactionDate=toISO(new Date());
      if(!t.paymentMethod)t.paymentMethod='Transfer Bank';
      if(typeof t.amount!=='number')t.amount=Number(t.amount)||0;
    });
  }
  if(Array.isArray(d.rooms))d.rooms.forEach(r=>{delete r.pricingPlans});
  if(Array.isArray(d.rentals))d.rentals.forEach(r=>{if(!Array.isArray(r.logs))r.logs=[]});
  if(!Array.isArray(d.waHistory))d.waHistory=[];
  return d;
}
function loadPersisted(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return false;
    let d=JSON.parse(raw);
    if(!d||!Array.isArray(d.rooms))return false;
    d=migrateData(d);
    state.rooms=d.rooms||[];
    state.tenants=Array.isArray(d.tenants)?d.tenants:[];
    state.rentals=Array.isArray(d.rentals)?d.rentals:[];
    state.transactions=Array.isArray(d.transactions)?d.transactions:[];
    state.waHistory=Array.isArray(d.waHistory)?d.waHistory:[];
    state.counters=d.counters||{};
    state.settings=Object.assign({lateFeePerDay:20000},d.settings||{});
    const n=new Date();
    state.today=new Date(n.getFullYear(),n.getMonth(),n.getDate(),12);
    state.reportMonth={year:state.today.getFullYear(),month:state.today.getMonth()};
    return true;
  }catch(e){console.error('Load gagal:',e);return false}
}

function downloadCSV(filename,rows){
  const csv=rows.map(row=>row.map(c=>{
    const s=String(c==null?'':c);
    return/[",\n\r]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;
  }).join(',')).join('\r\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  toast('File CSV berhasil diunduh','ok');
}
function importData(file){
  const rd=new FileReader();
  rd.onload=e=>{
    const txt=e.target.result;
    const isJSON=file.name.toLowerCase().endsWith('.json')||txt.trim().startsWith('{');
    if(isJSON){
      try{
        let d=JSON.parse(txt);
        if(!Array.isArray(d.rooms)||!Array.isArray(d.tenants))throw new Error('Format tidak valid');
        if(!confirmAction('Import akan MENGGANTI seluruh data saat ini. Lanjutkan?'))return;
        d=migrateData(d);
        state.rooms=d.rooms;state.tenants=d.tenants;
        state.rentals=d.rentals||[];state.transactions=d.transactions||[];
        state.waHistory=d.waHistory||[];state.counters=d.counters||{};
        state.settings=Object.assign({lateFeePerDay:20000},d.settings||{});
        persist();persistWA();render();
        toast('Data berhasil dimuat','ok');
      }catch(err){toast('Gagal memuat: '+err.message,'err')}
    }else{
      try{
        const lines=txt.split(/\r?\n/).filter(l=>l.trim());
        if(lines.length<1)throw new Error('File kosong');
        const first=lines[0].toLowerCase();
        const startIdx=/nama|name/.test(first)?1:0;
        let added=0;
        for(let i=startIdx;i<lines.length;i++){
          const cols=lines[i].split(',').map(s=>s.trim().replace(/^"|"$/g,''));
          if(!cols[0])continue;
          state.tenants.push({id:nextId('TNT'),name:cols[0],phone:cols[1]||'-',notes:cols[2]||''});
          added++;
        }
        persist();render();
        toast(added+' penyewa ditambahkan','ok');
      }catch(err){toast('Gagal memuat: '+err.message,'err')}
    }
  };
  rd.readAsText(file);
}

function calculateBilling(rental){
  const txs=state.transactions.filter(t=>t.rentalId===rental.id);
  const sum=k=>txs.filter(t=>(TX[t.type]||{}).kind===k).reduce((s,t)=>s+(Number(t.amount)||0),0);
  const totalDibayar=sum('payment');
  const biayaTambahan=sum('charge');
  const depositMasuk=sum('deposit');
  const refund=sum('refund');
  const totalTagihan=rental.totalPrice+biayaTambahan;
  return{transactions:txs,totalSewa:rental.totalPrice,biayaTambahan,totalTagihan,totalDibayar,sisa:Math.max(0,totalTagihan-totalDibayar),depositMasuk,refund};
}
function getPaymentStatus(b){
  if(b.totalTagihan<=0)return{label:'—',tone:'muted'};
  if(b.sisa<=0)return{label:'Lunas',tone:'success'};
  if(b.totalDibayar>0)return{label:'Belum Lunas',tone:'warning'};
  return{label:'Belum Bayar',tone:'danger'};
}

/* ============================================================
   STATUS ENGINE
   ============================================================ */
function calculateLateDays(r,today){
  today=today||state.today;
  const e=parseISO(r.endDate);
  if(!e)return 0;
  const l=diffDays(e,today);
  return l>0?l:0;
}
function calculateLateFee(r,today){
  const days=calculateLateDays(r,today);
  return{days,amount:days*state.settings.lateFeePerDay};
}
function getRentalStatus(r,today){
  today=today||state.today;
  if(r.status==='cancelled')return{code:'cancelled',label:'Dibatalkan',tone:'muted'};
  if(r.status==='finished')return{code:'finished',label:'Selesai',tone:'muted'};
  const s=parseISO(r.startDate),e=parseISO(r.endDate);
  if(!s||!e)return{code:'unknown',label:'—',tone:'muted'};
  if(today<s){const d=diffDays(today,s);return{code:'upcoming',label:`Mulai ${d} hari lagi`,tone:'info',daysToStart:d}}
  if(today<e){const d=diffDays(today,e);return{code:'active',label:`Aktif · ${d} hari lagi`,tone:'success',remainingDays:d}}
  if(today.getTime()===e.getTime())return{code:'lastday',label:'Jatuh tempo hari ini',tone:'warning',remainingDays:0};
  const late=diffDays(e,today);
  return{code:'overdue',label:`Terlambat ${late} hari`,tone:'danger',lateDays:late};
}
function getRoomDisplayStatus(room,today){
  today=today||state.today;
  if(room.manualStatus==='maintenance')return{code:'maintenance',label:'Perbaikan',tone:'muted'};
  const rs=state.rentals.filter(r=>r.roomId===room.id&&r.status!=='cancelled'&&r.status!=='finished');
  const active=rs.find(r=>parseISO(r.startDate)<=today&&today<=parseISO(r.endDate));
  if(active)return{code:'terisi',label:'Terisi',tone:'success',rental:active};
  const up=rs.filter(r=>parseISO(r.startDate)>today).sort((a,b)=>a.startDate.localeCompare(b.startDate))[0];
  if(up)return{code:'booking',label:'Sudah Dipesan',tone:'info',rental:up};
  return{code:'kosong',label:'Kosong',tone:'muted'};
}
const DUE_SOON_DAYS=7;
function getTaskList(today){
  today=today||state.today;
  const tasks={urgent:[],warning:[],info:[]};
  state.rentals.forEach(r=>{
    if(r.status==='cancelled'||r.status==='finished')return;
    const st=getRentalStatus(r,today);const b=calculateBilling(r);
    if(st.code==='overdue')tasks.urgent.push({rental:r,st,b,reason:`Terlambat ${st.lateDays} hari`});
    else if(st.code==='lastday')tasks.urgent.push({rental:r,st,b,reason:'Jatuh tempo hari ini'});
    else if(st.code==='active'&&st.remainingDays<=DUE_SOON_DAYS)tasks.warning.push({rental:r,st,b,reason:`Jatuh tempo ${st.remainingDays} hari lagi`});
    else if(st.code==='upcoming'&&st.daysToStart<=DUE_SOON_DAYS)tasks.info.push({rental:r,st,b,reason:`Mulai ${st.daysToStart} hari lagi`});
  });
  tasks.urgent.sort((a,b)=>a.rental.endDate.localeCompare(b.rental.endDate));
  tasks.warning.sort((a,b)=>a.rental.endDate.localeCompare(b.rental.endDate));
  tasks.info.sort((a,b)=>a.rental.startDate.localeCompare(b.rental.startDate));
  return tasks;
}
function checkRentalConflict(roomId,sISO,eISO,excl){
  const s=parseISO(sISO),e=parseISO(eISO);
  if(!s||!e)return null;
  return state.rentals.find(r=>r.roomId===roomId&&r.id!==excl&&r.status!=='cancelled'&&r.status!=='finished'&&s<=parseISO(r.endDate)&&parseISO(r.startDate)<=e)||null;
}

  else if(st.code==='upcoming')L.push(`Kami dari manajemen kos ingin mengingatkan bahwa masa sewa kamar *${room?room.name:rental.roomId}* Anda akan dimulai dalam *${st.daysToStart} hari* pada *${formatTanggalID(rental.startDate,true)}*.`);
  L.push('');L.push('Rincian Tagihan:');

  L.push(`• Total tagihan: ${rupiah(b.totalTagihan)}`);
  L.push(`• Sudah dibayar: ${rupiah(b.totalDibayar)}`);
  L.push(`• *Sisa tagihan: ${rupiah(b.sisa)}*`);

/* ============================================================
   BULK WA
   ============================================================ */
const bulkState={running:false,stop:false,index:0,rows:[],total:0};
function startBulkWA(){
  const tasks=getTaskList();
  const rows=[...tasks.urgent,...tasks.warning];
  if(!rows.length)return toast('Tidak ada yang perlu diingatkan','ok');
  const withPhone=rows.filter(x=>{const t=getTenant(x.rental.tenantId);return t&&cleanPhone(t.phone)});
  const noPhone=rows.length-withPhone.length;
  if(!withPhone.length)return toast('Semua penyewa belum punya nomor HP','err');
  const msg=`Kirim pengingat WhatsApp ke ${withPhone.length} penyewa?`+
    (noPhone?`\n\n(${noPhone} penyewa dilewati karena tanpa nomor HP)`:'')+
    `\n\nTab WhatsApp akan terbuka otomatis. Izinkan pop-up di browser Anda.`;
  if(!confirmAction(msg))return;
  bulkState.running=true;bulkState.stop=false;bulkState.index=0;
  bulkState.rows=withPhone;bulkState.total=withPhone.length;
  el('bulkPanel').classList.remove('hidden');
  updateBulkUI();
  runBulkNext();
}
function updateBulkUI(){
  const{index,total,rows}=bulkState;
  el('bulkCount').textContent=`${index} / ${total}`;
  if(index<total){
    const t=getTenant(rows[index].rental.tenantId);
    el('bulkLabel').textContent=`Mengirim ke ${t?t.name:''}...`;
  }else el('bulkLabel').textContent='Selesai';
  el('bulkBar').style.width=(total?(index/total*100):0)+'%';
}
function runBulkNext(){
  if(bulkState.stop||bulkState.index>=bulkState.total){finishBulk();return}
  const item=bulkState.rows[bulkState.index];
  const t=getTenant(item.rental.tenantId);
  const phone=cleanPhone(t?t.phone:'');
  if(!phone){bulkState.index++;updateBulkUI();setTimeout(runBulkNext,300);return}
  const msg=buildReminderMessage(item.rental);
  const url=`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
  const ok=openWA(url);
  if(!ok){bulkState.stop=true;finishBulk();return}
  logWASent(item.rental,msg);
  bulkState.index++;updateBulkUI();
  setTimeout(runBulkNext,1800);
}
function stopBulk(){bulkState.stop=true;toast('Dihentikan','')}
function finishBulk(){
  bulkState.running=false;
  toast(`Selesai — ${bulkState.index} pesan diproses`,'wa');
  render();
  setTimeout(()=>{el('bulkPanel').classList.add('hidden');el('bulkBar').style.width='0'},2000);
}

    return `<button data-action="open-room" data-id="${r.id}" type="button" class="action-card text-left bg-white border border-ink-200/60 rounded-xl2 shadow-card p-5 flex flex-col">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <div class="text-[14px] font-bold text-ink-900 truncate">${esc(r.name)}</div>
          <div class="text-[10.5px] text-ink-400 mt-0.5 truncate">${esc(r.facilities||'')}</div>
        </div>
        <span class="inline-flex items-center gap-1.5 text-[10.5px] font-semibold text-ink-500 whitespace-nowrap">
          <span class="w-2 h-2 rounded-full ${toneDot}"></span>${s.label}
        </span>
      </div>
      <div class="mt-3 text-[18px] font-bold text-ink-900 bignum">${rupiah(r.priceMonthly)}<span class="text-[11px] font-medium text-ink-400"> /bulan</span></div>
      ${info}
    </button>`;
  };

  return card(
    cardHead('Kamar',`${state.rooms.length} kamar · ${statusesAll.filter(s=>s.code==='terisi').length} terisi`,
      pillHTML(pills,f,'filter-rooms')+
      `<button class="btn-primary" data-action="add-room" type="button"><i class="fa-solid fa-plus text-[11px]"></i> Tambah Kamar</button>`)+
    (rooms.length?`<div class="p-5 grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${rooms.map(roomCard).join('')}</div>`:emptyState('fa-door-open','Tidak ada kamar yang cocok.'))
  );
}

/* ============================================================
   VIEW: PENYEWA
   ============================================================ */
function viewTenants(){
  const rows=state.tenants.filter(t=>matchQ(t.name,t.phone,t.notes)).map(t=>{
    const rs=state.rentals.filter(r=>r.tenantId===t.id&&r.status!=='cancelled'&&r.status!=='finished');
    const act=rs.find(r=>parseISO(r.startDate)<=state.today&&state.today<=parseISO(r.endDate))||null;
    const next=rs.filter(r=>parseISO(r.startDate)>state.today).sort((a,b)=>a.startDate.localeCompare(b.startDate))[0]||null;
    const shown=act||next;
    const type=detectTenantType(t.id,null);
    const b=shown?calculateBilling(shown):null;
    const ps=b?getPaymentStatus(b):null;
    const st=shown?getRentalStatus(shown):null;
    const room=shown?getRoom(shown.roomId):null;
    const phone=cleanPhone(t.phone);
    return `<button data-action="open-tenant" data-id="${t.id}" type="button" class="w-full text-left table-row border-t border-ink-200/60 hover:bg-ink-100/40 flex items-center gap-4 px-5 py-4">
      <div class="w-10 h-10 rounded-full bg-accent-soft flex items-center justify-center flex-shrink-0">
        <span class="text-[13px] font-bold text-accent">${esc((t.name||'?').slice(0,1).toUpperCase())}</span>
      </div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2">
          <div class="font-semibold text-[13.5px] text-ink-900 truncate">${esc(t.name)}</div>
          ${badge(type==='lama'?'info':'primary',type==='lama'?'Lama':'Baru')}
        </div>
        <div class="text-[11.5px] text-ink-500 mt-0.5 tabular-nums truncate">${esc(t.phone||'belum ada nomor')}</div>
      </div>
      <div class="hidden sm:block min-w-0 flex-shrink-0 text-right">
        ${shown?`
          <div class="text-[12.5px] font-semibold text-ink-800">${esc(room?room.name:shown.roomId)}</div>
          <div class="text-[11px] text-ink-400 tabular-nums">${formatTanggalShort(shown.startDate)} – ${formatTanggalShort(shown.endDate)}</div>
        `:'<span class="text-[12px] text-ink-400">Tidak aktif</span>'}
      </div>
      <div class="hidden md:block flex-shrink-0">
        ${st?badge(st.tone,st.label):badge('muted','—')}
      </div>
      <div class="hidden lg:block flex-shrink-0">
        ${ps?badge(ps.tone,ps.label+(b.sisa>0?` · ${rupiah(b.sisa)}`:'')):''}
      </div>
      <i class="fa-solid fa-chevron-right text-[11px] text-ink-300 flex-shrink-0"></i>
    </button>`;
  }).join('');
  return card(
    cardHead('Penyewa',`${state.tenants.length} orang terdaftar`,
      `<button class="btn-primary" data-action="add-tenant" type="button"><i class="fa-solid fa-plus text-[11px]"></i> Tambah</button>`)+
    (rows?`<div class="divide-y divide-ink-200/60">${rows}</div>`:emptyState('fa-users','Belum ada penyewa.'))
  );
}

  const rs=state.rentals.filter(r=>r.tenantId===t.id).sort((a,b)=>b.startDate.localeCompare(a.startDate));

  const type=detectTenantType(t.id,null);

    const rroom=getRoom(r.roomId);

      <div class="min-w-0">
        <div class="text-[12.5px] font-semibold text-ink-800">${esc(rroom?rroom.name:r.roomId)}</div>

  openDrawer(
    drawerHeader(esc(t.name),esc(t.phone||'belum ada nomor'),

      <div class="flex items-center gap-2 flex-wrap">

      </div>

      ${active?`
        <div class="rounded-xl2 border border-ink-200/60 p-5 bg-white">
          <div class="flex items-center justify-between gap-3 mb-2">
            <div class="text-[11px] font-semibold text-ink-400 tracking-wider uppercase">Sewa Aktif</div>
            ${badge(st.tone,st.label)}
          </div>
          <div class="text-[16px] font-bold text-ink-900">${esc(room?room.name:active.roomId)}</div>
          <div class="text-[12px] text-ink-500 mt-0.5 tabular-nums">${formatTanggalID(active.startDate)} – ${formatTanggalID(active.endDate)}</div>
          <div class="grid grid-cols-2 gap-3 mt-4">
            <div class="rounded-xl bg-ink-100 px-4 py-3">
              <div class="text-[10px] font-semibold text-ink-500 tracking-wider uppercase">Total</div>
              <div class="text-[14px] font-bold text-ink-900 bignum mt-0.5">${rupiah(b.totalTagihan)}</div>
            </div>
            <div class="rounded-xl ${b.sisa>0?'bg-terra-soft':'bg-sage-soft'} px-4 py-3">
              <div class="text-[10px] font-semibold text-ink-500 tracking-wider uppercase">${b.sisa>0?'Belum Dibayar':'Lunas'}</div>
              <div class="text-[14px] font-bold ${b.sisa>0?'text-terra':'text-sage'} bignum mt-0.5">${rupiah(b.sisa)}</div>
            </div>
          </div>
        </div>
      `:`
        <div class="rounded-xl2 bg-ink-100 p-5 text-center">
          <i class="fa-solid fa-circle-info text-ink-400 text-[20px]"></i>
          <p class="text-[12.5px] text-ink-500 mt-2">Belum ada sewa aktif</p>
        </div>
      `}

      <div class="grid grid-cols-2 gap-2">

          <button class="btn-primary justify-center" data-action="quick-pay" data-id="${active.id}" type="button"><i class="fa-solid fa-money-bill-wave text-[11px]"></i> Catat Bayar</button>
        `:`
          <button class="btn-primary justify-center col-span-2" data-action="rent-tenant" data-id="${t.id}" type="button"><i class="fa-solid fa-plus text-[11px]"></i> Sewakan Kamar</button>
        `}
      </div>

      ${t.notes?`<div class="rounded-xl bg-amber-soft border border-amber-ring/40 px-4 py-3 text-[12.5px] text-amber"><i class="fa-solid fa-note-sticky mr-2"></i>${esc(t.notes)}</div>`:''}

      ${history?`
        <div>

          <div class="flex flex-col gap-2">${history}</div>
        </div>
      `:''}
    </div>`
  );
}

/* ============================================================
   VIEW: UANG (3 tab: Pembayaran, Tagihan, Laporan)
   ============================================================ */
function viewMoney(){
  const tabs=[['pembayaran','Pembayaran','fa-money-bill-wave'],['tagihan','Tagihan','fa-file-invoice'],['laporan','Laporan','fa-chart-line']];
  const inner = state.moneyTab==='tagihan' ? viewBills() : state.moneyTab==='laporan' ? viewReports() : viewPayments();
  return `
    <div class="mb-5">${tabHTML(tabs,state.moneyTab,'money-tab')}</div>
    ${inner}
  `;
}
function viewPayments(){
  const KIND_TONE={payment:'success',deposit:'info',charge:'warning',refund:'danger'};
  const list=state.transactions
    .filter(t=>matchQ(tenantName(t.tenantId),(getRoom(t.roomId)||{}).name,TX[t.type]?TX[t.type].label:t.type,t.notes))
    .slice().sort((a,b)=>b.transactionDate.localeCompare(a.transactionDate)||b.id.localeCompare(a.id));
  const sum=k=>state.transactions.filter(t=>(TX[t.type]||{}).kind===k).reduce((s,t)=>s+(Number(t.amount)||0),0);
  const chips=[
    ['Masuk',sum('payment'),'bg-sage-soft','text-sage'],
    ['Deposit',sum('deposit'),'bg-steel-soft','text-steel'],
    ['Biaya & Denda',sum('charge'),'bg-amber-soft','text-amber'],
    ['Pengembalian',sum('refund'),'bg-terra-soft','text-terra']
  ];
  const rows=list.map(t=>{
    const tx=TX[t.type]||{label:t.type,kind:'payment',icon:'fa-receipt'};
    const label=tx.label+(t.subtype?` · ${esc(t.subtype)}`:'');
    return `<tr class="table-row border-t border-ink-200/60 hover:bg-ink-100/40">
      ${td(`<span class="text-[12.5px] text-ink-700 tabular-nums whitespace-nowrap">${formatTanggalShort(t.transactionDate)}</span>`)}
      ${td(`<div class="text-[12.5px] font-medium text-ink-800">${esc(tenantName(t.tenantId))}</div><div class="text-[11px] text-ink-400">${esc((getRoom(t.roomId)||{}).name||'-')}</div>`)}
      ${td(badge(KIND_TONE[tx.kind]||'muted',`<i class="fa-solid ${tx.icon} text-[9px]"></i> ${label}`))}
      ${td(`<span class="text-[12px] text-ink-600">${esc(t.paymentMethod||'-')}</span>`)}
      ${td(`<span class="text-[13px] font-semibold tabular-nums ${tx.kind==='refund'?'text-terra':'text-ink-900'}">${tx.kind==='refund'?'-':''}${rupiah(t.amount)}</span>`,'whitespace-nowrap')}
      ${td(`<span class="text-[11.5px] text-ink-500">${esc(t.notes||'')}</span>`,'max-w-[220px]')}
      ${td(`<button class="btn-ghost" data-action="del-tx" data-id="${t.id}" type="button" title="Hapus"><i class="fa-regular fa-trash-can text-[11px]"></i></button>`,'text-right')}
    </tr>`;
  }).join('');
  return card(
    cardHead('Pembayaran',`${state.transactions.length} catatan`,
      `<button class="btn-secondary" data-action="export-tx" type="button"><i class="fa-solid fa-file-csv text-[11px]"></i> Unduh CSV</button>`)+
    `<div class="px-6 py-4 grid grid-cols-2 lg:grid-cols-4 gap-3 border-b border-ink-200/60">${chips.map(c=>`
      <div class="rounded-xl ${c[2]} border border-ink-200/50 px-4 py-3">
        <div class="text-[10.5px] font-semibold text-ink-500 tracking-wider uppercase">${c[0]}</div>
        <div class="text-[15px] font-bold ${c[3]} bignum mt-1">${rupiah(c[1])}</div>
      </div>`).join('')}</div>`+
    (rows?tableWrap(`<table class="w-full">${th('Tanggal','Penyewa','Jenis','Metode','Jumlah','Catatan','')}${rows}</table>`):emptyState('fa-receipt','Belum ada pembayaran.'))
  );
}
function viewBills(){
  // Daftar tagihan per sewa (bukan transaksi)
  const list=state.rentals
    .filter(r=>r.status!=='cancelled')
    .map(r=>({r,b:calculateBilling(r),st:getRentalStatus(r)}))
    .filter(x=>x.b.totalTagihan>0)
    .sort((a,b)=>(b.b.sisa>0?1:0)-(a.b.sisa>0?1:0)||a.r.endDate.localeCompare(b.r.endDate));
  const totalTagih=list.reduce((s,x)=>s+x.b.totalTagihan,0);
  const totalBayar=list.reduce((s,x)=>s+x.b.totalDibayar,0);
  const totalSisa=list.reduce((s,x)=>s+x.b.sisa,0);
  const rows=list.map(({r,b,st})=>{
    const room=getRoom(r.roomId);
    const ps=getPaymentStatus(b);
    return `<tr class="table-row border-t border-ink-200/60 hover:bg-ink-100/40">
      ${td(`<div class="text-[12.5px] font-semibold text-ink-900">${esc(tenantName(r.tenantId))}</div><div class="text-[11px] text-ink-400">${esc(room?room.name:r.roomId)}</div>`)}

      ${td(`<span class="text-[12.5px] tabular-nums">${rupiah(b.totalTagihan)}</span>`)}
      ${td(`<span class="text-[12.5px] tabular-nums text-sage">${rupiah(b.totalDibayar)}</span>`)}
      ${td(`<span class="text-[13px] font-bold tabular-nums ${b.sisa>0?'text-terra':'text-ink-400'}">${rupiah(b.sisa)}</span>`)}
      ${td(badge(ps.tone,ps.label))}
      ${td(`<div class="flex items-center gap-1.5 justify-end">
        ${waButtonHTML(r.id,'sm','WA')}
        <button class="btn-ghost" data-action="quick-pay" data-id="${r.id}" type="button">${b.sisa>0?'<i class="fa-solid fa-money-bill-wave text-[10px]"></i> Bayar':'Detail'}</button>
      </div>`,'text-right')}
    </tr>`;
  }).join('');
  return card(
    cardHead('Tagihan',`${list.length} sewa terdaftar`,
      `<button class="btn-secondary" data-action="export-bills" type="button"><i class="fa-solid fa-file-csv text-[11px]"></i> Unduh CSV</button>`)+
    `<div class="px-6 py-4 grid grid-cols-3 gap-3 border-b border-ink-200/60">
      <div class="rounded-xl bg-ink-100 px-4 py-3">
        <div class="text-[10.5px] font-semibold text-ink-500 tracking-wider uppercase">Total Tagihan</div>
        <div class="text-[15px] font-bold text-ink-900 bignum mt-1">${rupiah(totalTagih)}</div>
      </div>
      <div class="rounded-xl bg-sage-soft px-4 py-3">
        <div class="text-[10.5px] font-semibold text-ink-500 tracking-wider uppercase">Sudah Dibayar</div>
        <div class="text-[15px] font-bold text-sage bignum mt-1">${rupiah(totalBayar)}</div>
      </div>
      <div class="rounded-xl bg-terra-soft px-4 py-3">
        <div class="text-[10.5px] font-semibold text-ink-500 tracking-wider uppercase">Belum Dibayar</div>
        <div class="text-[15px] font-bold text-terra bignum mt-1">${rupiah(totalSisa)}</div>
      </div>
    </div>`+
    (rows?tableWrap(`<table class="w-full">${th('Penyewa','Periode','Tagihan','Dibayar','Sisa','Status','')}${rows}</table>`):emptyState('fa-file-invoice','Belum ada tagihan.'))
  );
}
function viewReports(){
  const rm=state.reportMonth;
  const ms=new Date(rm.year,rm.month,1,12);
  const me=new Date(rm.year,rm.month+1,0,12);
  const msISO=toISO(ms),meISO=toISO(me);
  const label=`${BULAN[rm.month]} ${rm.year}`;
  const inMonthTx=state.transactions.filter(t=>{const d=parseISO(t.transactionDate);return!!d&&d>=ms&&d<=me});
  const KIND_LABEL={payment:'Pembayaran (Sewa / Uang Muka)',deposit:'Deposit',charge:'Biaya Tambahan & Denda',refund:'Pengembalian'};
  const rekap=['payment','deposit','charge','refund'].map(k=>{
    const arr=inMonthTx.filter(t=>(TX[t.type]||{}).kind===k);
    return{k,n:arr.length,total:arr.reduce((s,t)=>s+(Number(t.amount)||0),0)};
  });
  const rekapRows=rekap.map(x=>`<tr class="table-row border-t border-ink-200/60">
    ${td(`<span class="text-[12.5px] font-medium text-ink-800">${KIND_LABEL[x.k]}</span>`)}
    ${td(`<span class="text-[12.5px] text-ink-600 tabular-nums">${x.n}x</span>`)}
    ${td(`<span class="text-[12.5px] font-semibold tabular-nums">${rupiah(x.total)}</span>`,'text-right')}
  </tr>`).join('');
  const totalMasuk=rekap.find(x=>x.k==='payment').total+rekap.find(x=>x.k==='deposit').total;
  return `
  ${card(
    cardHead('Laporan — '+label,'Rekap bulanan',
      `<button class="btn-secondary" data-action="report-prev" type="button"><i class="fa-solid fa-chevron-left text-[11px]"></i></button>
       <button class="btn-secondary" data-action="report-next" type="button"><i class="fa-solid fa-chevron-right text-[11px]"></i></button>
       <button class="btn-primary" data-action="export-report" type="button"><i class="fa-solid fa-file-csv text-[11px]"></i> Unduh</button>`)+
    `<div class="p-5 grid sm:grid-cols-2 gap-3">
      <div class="rounded-xl bg-sage-soft px-5 py-4">
        <div class="text-[11px] font-semibold text-ink-500 tracking-wider uppercase">Total Uang Masuk</div>
        <div class="text-[22px] font-bold text-sage bignum mt-1">${rupiah(totalMasuk)}</div>
      </div>
      <div class="rounded-xl bg-ink-100 px-5 py-4">
        <div class="text-[11px] font-semibold text-ink-500 tracking-wider uppercase">Transaksi</div>
        <div class="text-[22px] font-bold text-ink-900 bignum mt-1">${inMonthTx.length}</div>
      </div>
    </div>`)}
  <div class="mt-5">${card(cardHead('Rincian',label)+tableWrap(`<table class="w-full">${th('Jenis','Jumlah','Total')}${rekapRows}</table>`))}</div>
  `;
}

/* ============================================================
   WIZARD: SEWAKAN KAMAR (3 langkah)
   ============================================================ */
const wizard={
  step:1, roomId:'',
  tenantMode:'existing', tenantId:'', newName:'', newPhone:'',
  startDate:'', durationValue:1, durationUnit:'month',
  totalPrice:0, priceTouched:false
};

function openRentWizard(preset){
  preset=preset||{};
  wizard.step=1;
  wizard.roomId=preset.roomId||'';
  wizard.tenantMode='existing';
  wizard.tenantId=preset.tenantId||'';
  wizard.newName='';wizard.newPhone='';
  wizard.startDate=toISO(state.today);
  wizard.durationValue=1;wizard.durationUnit='month';
  wizard.totalPrice=0;wizard.priceTouched=false;
  renderWizard();
}
function renderWizard(){
  const stepIndicator=(n)=>{
    const labels=['Pilih Kamar','Pilih Penyewa','Durasi & Harga'];
    return `<div class="flex items-center gap-2 px-6 pt-5">
      ${labels.map((l,i)=>{
        const num=i+1,active=num===wizard.step,done=num<wizard.step;
        return `<div class="flex items-center gap-2 flex-1 min-w-0">
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-bold flex-shrink-0 ${done?'bg-sage text-white':active?'bg-accent text-white':'bg-ink-200 text-ink-500'}">${done?'<i class="fa-solid fa-check text-[10px]"></i>':num}</span>
            <span class="text-[12px] font-semibold truncate hidden sm:inline ${active?'text-ink-900':'text-ink-400'}">${l}</span>
          </div>
          ${i<2?`<span class="flex-1 h-[2px] rounded-full ${done?'bg-sage':'bg-ink-200'}"></span>`:''}
        </div>`;
      }).join('')}
    </div>`;
  };

  let body='';
  if(wizard.step===1){
    const kosong=state.rooms.filter(r=>getRoomDisplayStatus(r).code==='kosong');
    const grid=kosong.map(r=>{
      const sel=r.id===wizard.roomId;
      return `<button data-action="wiz-room" data-id="${r.id}" type="button" class="action-card text-left bg-white border-2 ${sel?'border-accent shadow-card':'border-ink-200/60'} rounded-xl2 p-4 hover:border-accent-ring transition-colors">
        <div class="flex items-start justify-between gap-2">
          <div class="text-[14px] font-bold text-ink-900">${esc(r.name)}</div>
          ${sel?'<i class="fa-solid fa-circle-check text-accent"></i>':''}
        </div>
        <div class="text-[11px] text-ink-500 mt-0.5 truncate">${esc(r.facilities||'')}</div>
        <div class="text-[15px] font-bold text-ink-900 bignum mt-2">${rupiah(r.priceMonthly)}<span class="text-[10.5px] text-ink-400 font-medium"> /bln</span></div>
      </button>`;
    }).join('');
    body=`<div class="p-6">
      <h4 class="text-[14px] font-bold text-ink-900 mb-1">Pilih kamar yang akan disewakan</h4>
      <p class="text-[12px] text-ink-500 mb-4">Hanya kamar kosong yang muncul di sini.</p>
      ${kosong.length?`<div class="grid sm:grid-cols-2 gap-3 max-h-[400px] overflow-y-auto pr-1">${grid}</div>`:emptyState('fa-door-closed','Semua kamar sudah terisi. Tambahkan kamar dulu di menu Kamar.')}
    </div>
    <div class="px-6 py-4 border-t border-ink-200/60 bg-ink-100/40 flex justify-between gap-2">
      <button class="btn-secondary" data-action="close-modal" type="button">Batal</button>
      <button class="btn-primary" data-action="wiz-next" type="button" ${wizard.roomId?'':'disabled style="opacity:.5"'}>Lanjut <i class="fa-solid fa-arrow-right text-[11px]"></i></button>
    </div>`;
  } else if(wizard.step===2){
    const existing=state.tenants.length>0;
    const tenantOpts=state.tenants.map(t=>`<option value="${esc(t.id)}"${t.id===wizard.tenantId?' selected':''}>${esc(t.name)} ${t.phone?'· '+esc(t.phone):''}</option>`).join('');
    body=`<div class="p-6 flex flex-col gap-5">
      <div>
        <h4 class="text-[14px] font-bold text-ink-900 mb-1">Siapa yang menyewa?</h4>
        <p class="text-[12px] text-ink-500">Pilih penyewa lama, atau tambahkan orang baru.</p>
      </div>
      ${existing?`
        <div class="grid grid-cols-2 gap-2">
          <button data-action="wiz-tenant-mode" data-id="existing" type="button" class="rounded-xl border-2 ${wizard.tenantMode==='existing'?'border-accent bg-accent-soft':'border-ink-200/60 bg-white'} p-4 text-left">
            <i class="fa-solid fa-user-check text-[14px] ${wizard.tenantMode==='existing'?'text-accent':'text-ink-400'}"></i>
            <div class="text-[13px] font-bold text-ink-900 mt-2">Penyewa Lama</div>
            <div class="text-[11px] text-ink-500 mt-0.5">Sudah pernah menginap</div>
          </button>
          <button data-action="wiz-tenant-mode" data-id="new" type="button" class="rounded-xl border-2 ${wizard.tenantMode==='new'?'border-accent bg-accent-soft':'border-ink-200/60 bg-white'} p-4 text-left">
            <i class="fa-solid fa-user-plus text-[14px] ${wizard.tenantMode==='new'?'text-accent':'text-ink-400'}"></i>
            <div class="text-[13px] font-bold text-ink-900 mt-2">Orang Baru</div>
            <div class="text-[11px] text-ink-500 mt-0.5">Pertama kali menyewa</div>
          </button>
        </div>
      `:''}
      ${wizard.tenantMode==='existing'&&existing?`
        <label class="flex flex-col gap-1.5">
          <span class="text-[11px] font-semibold text-ink-400 tracking-wider uppercase">Pilih Penyewa</span>
          <select id="wizTenantSel" class="f-input">
            <option value="">— Pilih —</option>
            ${tenantOpts}
          </select>
        </label>
      `:`
        <div class="grid sm:grid-cols-2 gap-4">
          ${fld('Nama Lengkap',`<input id="wizNewName" value="${esc(wizard.newName)}" class="f-input" placeholder="cth: Bu Sarah">`)}
          ${fld('No. WhatsApp',`<input id="wizNewPhone" value="${esc(wizard.newPhone)}" class="f-input" placeholder="08xx / 62xx">`)}
        </div>
      `}
    </div>
    <div class="px-6 py-4 border-t border-ink-200/60 bg-ink-100/40 flex justify-between gap-2">
      <button class="btn-secondary" data-action="wiz-back" type="button"><i class="fa-solid fa-arrow-left text-[11px]"></i> Kembali</button>
      <button class="btn-primary" data-action="wiz-next" type="button">Lanjut <i class="fa-solid fa-arrow-right text-[11px]"></i></button>
    </div>`;
  } else {
    const room=getRoom(wizard.roomId);
    const preview=calculateRentalEndDate(wizard.startDate,wizard.durationValue,wizard.durationUnit);
    const autoPrice=room?autoPriceFor(room,wizard.durationValue,wizard.durationUnit):0;
    const shownPrice=wizard.priceTouched?wizard.totalPrice:autoPrice;
    const conflict=preview?checkRentalConflict(wizard.roomId,wizard.startDate,toISO(preview.end),null):null;

    const tenantLabel=wizard.tenantMode==='new'
      ? (wizard.newName||'(orang baru)')
      : tenantName(wizard.tenantId);

    body=`<div class="p-6 flex flex-col gap-5">
      <div>
        <h4 class="text-[14px] font-bold text-ink-900 mb-1">Berapa lama & berapa harganya?</h4>
        <p class="text-[12px] text-ink-500">Harga otomatis terisi, tapi bisa diubah.</p>
      </div>

      <div class="rounded-xl2 bg-accent-soft border border-accent-ring/40 p-4 flex items-center gap-3">
        <i class="fa-solid fa-circle-info text-accent"></i>
        <div class="min-w-0 text-[12.5px]">
          <div class="font-semibold text-ink-800 truncate">${esc(room?room.name:'-')}</div>
          <div class="text-ink-500 truncate">untuk ${esc(tenantLabel)}</div>
        </div>
      </div>

      ${fld('Tanggal Mulai',`<input id="wizStart" type="date" value="${esc(wizard.startDate)}" class="f-input">`)}

      <div class="grid grid-cols-2 gap-3">
        ${fld('Berapa lama?',`<input id="wizDur" type="number" min="1" value="${wizard.durationValue}" class="f-input">`)}
        ${fld('Satuan',`<select id="wizUnit" class="f-input">
          <option value="day"${wizard.durationUnit==='day'?' selected':''}>Hari</option>
          <option value="week"${wizard.durationUnit==='week'?' selected':''}>Minggu</option>
          <option value="month"${wizard.durationUnit==='month'?' selected':''}>Bulan</option>
        </select>`)}
      </div>

      ${fld('Harga Total (Rp)',`<input id="wizPrice" type="number" min="0" step="1000" value="${shownPrice||''}" class="f-input">`)}

      <div id="wizPreview" class="rounded-xl2 border border-ink-200/60 p-4 text-[12.5px] leading-relaxed">
        ${preview?`
          <div class="flex items-center gap-2 text-ink-700">
            <i class="fa-solid fa-calendar-check text-accent"></i>
            <span>Berakhir <strong>${formatTanggalID(toISO(preview.end),true)}</strong> · ${preview.totalDays} hari</span>
          </div>
          ${conflict?`<div class="mt-2 text-terra font-semibold"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Bentrok dengan ${esc(tenantName(conflict.tenantId))}</div>`:''}
        `:'<span class="text-ink-400">Isi tanggal & durasi.</span>'}
      </div>
    </div>
    <div class="px-6 py-4 border-t border-ink-200/60 bg-ink-100/40 flex justify-between gap-2">
      <button class="btn-secondary" data-action="wiz-back" type="button"><i class="fa-solid fa-arrow-left text-[11px]"></i> Kembali</button>
      <button class="btn-primary" data-action="wiz-finish" type="button"><i class="fa-solid fa-check"></i> Sewakan Sekarang</button>
    </div>`;
  }

  openModal(
    modalHeader('Sewakan Kamar','Ikuti langkah-langkahnya — hanya butuh 30 detik')+
    stepIndicator(wizard.step)+
    body,'lg'
  );

  // Attach dynamic listeners for step 3
  if(wizard.step===3){
    const upd=()=>{
      wizard.startDate=el('wizStart').value;
      wizard.durationValue=parseInt(el('wizDur').value,10)||0;
      wizard.durationUnit=el('wizUnit').value;
      const room=getRoom(wizard.roomId);
      if(!wizard.priceTouched&&room){
        const p=autoPriceFor(room,wizard.durationValue,wizard.durationUnit);
        el('wizPrice').value=p||'';
      }
      // Re-render preview only
      const preview=calculateRentalEndDate(wizard.startDate,wizard.durationValue,wizard.durationUnit);
      const conflict=preview?checkRentalConflict(wizard.roomId,wizard.startDate,toISO(preview.end),null):null;
      const box=el('wizPreview');
      if(box){
        box.innerHTML=preview?`
          <div class="flex items-center gap-2 text-ink-700">
            <i class="fa-solid fa-calendar-check text-accent"></i>
            <span>Berakhir <strong>${formatTanggalID(toISO(preview.end),true)}</strong> · ${preview.totalDays} hari</span>
          </div>
          ${conflict?`<div class="mt-2 text-terra font-semibold"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Bentrok dengan ${esc(tenantName(conflict.tenantId))}</div>`:''}
        `:'<span class="text-ink-400">Isi tanggal & durasi.</span>';
      }
    };
    ['wizStart','wizDur','wizUnit'].forEach(id=>{
      const n=el(id);if(n){n.addEventListener('change',upd);n.addEventListener('input',upd)}
    });
    const price=el('wizPrice');
    if(price)price.addEventListener('input',()=>{wizard.priceTouched=true});
  }
  // Auto-focus on new-tenant name field in step 2
  if(wizard.step===2&&wizard.tenantMode==='new'){
    setTimeout(()=>{const n=el('wizNewName');if(n)n.focus()},50);
  }
}
function autoPriceFor(room,value,unit){
  const v=clampNum(value);if(!v)return 0;
  if(unit==='month')return v*room.priceMonthly;
  if(unit==='week')return v*room.priceWeekly;
  return v*room.priceDaily;
}
function wizardNext(){
  if(wizard.step===1){
    if(!wizard.roomId)return toast('Pilih kamar dulu','err');
    wizard.step=2;
    renderWizard();
  } else if(wizard.step===2){
    if(wizard.tenantMode==='existing'){
      const sel=el('wizTenantSel');
      wizard.tenantId=sel?sel.value:'';
      if(!wizard.tenantId)return toast('Pilih penyewa dulu','err');
    } else {
      wizard.newName=(el('wizNewName').value||'').trim();
      wizard.newPhone=(el('wizNewPhone').value||'').trim();
      if(!wizard.newName)return toast('Nama penyewa wajib diisi','err');
    }
    wizard.step=3;
    renderWizard();
  }
}
function wizardBack(){
  if(wizard.step>1){wizard.step--;renderWizard()}
}
function wizardFinish(){
  // Collect step 3 values
  wizard.startDate=el('wizStart').value;
  wizard.durationValue=parseInt(el('wizDur').value,10)||0;
  wizard.durationUnit=el('wizUnit').value;
  const price=clampNum(el('wizPrice').value);

  if(!parseISO(wizard.startDate))return toast('Tanggal mulai tidak valid','err');
  if(wizard.durationValue<=0)return toast('Durasi harus lebih dari 0','err');
  if(price<=0)return toast('Harga harus lebih dari 0','err');

  const p=calculateRentalEndDate(wizard.startDate,wizard.durationValue,wizard.durationUnit);
  if(!p)return toast('Periode tidak valid','err');
  const conflict=checkRentalConflict(wizard.roomId,wizard.startDate,toISO(p.end),null);
  if(conflict)return toast(`Bentrok dengan ${tenantName(conflict.tenantId)}`,'err');

  // Resolve tenant
  let tenantId=wizard.tenantId;
  if(wizard.tenantMode==='new'){
    const nt={id:nextId('TNT'),name:wizard.newName,phone:wizard.newPhone||'-',notes:''};
    state.tenants.push(nt);tenantId=nt.id;
  }
  const status=parseISO(wizard.startDate)>state.today?'booked':'active';
  const rental={id:nextId('RTL'),roomId:wizard.roomId,tenantId,
    startDate:wizard.startDate,endDate:toISO(p.end),
    durationValue:wizard.durationValue,durationUnit:wizard.durationUnit,
    totalPrice:price,status,
    previousRentalId:null,availableDate:null,emptyDays:null,
    createdAt:toISO(state.today),logs:[]};
  state.rentals.push(rental);
  persist();
  closeModal();
  render();

  // Offer to log payment immediately
  setTimeout(()=>{
    if(confirmAction('Sewa berhasil dibuat!\n\nCatat pembayaran pertama sekarang?')){
      openTxForm(rental.id);
    } else {
      toast('Sewa berhasil dibuat','ok');
    }
  }, 200);
}

function saveTenant(id){
  const name=el('tfName').value.trim();
  if(!name)return toast('Nama wajib diisi','err');
  const phone=el('tfPhone').value.trim(),notes=el('tfNotes').value.trim();
  if(id){const t=getTenant(id);if(t){t.name=name;t.phone=phone;t.notes=notes}}
  else state.tenants.push({id:nextId('TNT'),name,phone:phone||'-',notes});
  persist();closeModal();render();
  toast(id?'Data penyewa diperbarui':'Penyewa ditambahkan','ok');
}
function openRoomForm(id){
  const r=id?getRoom(id):null;
  openModal(
    modalHeader(r?'Edit Kamar':'Tambah Kamar',r?esc(r.name):'Kamar baru')+
    `<div class="p-6 flex flex-col gap-4">

      <button class="btn-primary" data-action="save-room" data-id="${id||''}" type="button">Simpan</button>
    </div>`,'sm'

function saveRoom(id){
  const name=el('rfName').value.trim();
  const pm=clampNum(el('rfPrice').value);
  if(!name)return toast('Nama kamar wajib diisi','err');
  if(pm<=0)return toast('Harga bulanan harus lebih dari 0','err');
  let pw=clampNum(el('rfWeek').value),pd=clampNum(el('rfDay').value);
  if(!pw)pw=Math.round(pm/4.33/1000)*1000;
  if(!pd)pd=Math.round(pm/30/1000)*1000;
  const facilities=el('rfFac').value.trim();
  if(id){const r=getRoom(id);if(r){r.name=name;r.priceMonthly=pm;r.priceWeekly=pw;r.priceDaily=pd;r.facilities=facilities}}
  else state.rooms.push({id:nextId('RM'),name,priceMonthly:pm,priceWeekly:pw,priceDaily:pd,manualStatus:null,facilities});
  persist();closeModal();render();
  toast(id?'Kamar diperbarui':'Kamar ditambahkan','ok');
}

  const suggestAmount=presetAmount!=null?presetAmount:(b.sisa>0?b.sisa:'');
  openModal(
    modalHeader('Catat Pembayaran',`${esc(tenantName(r.tenantId))} — ${esc((getRoom(r.roomId)||{}).name||'')}`)+
    `<div class="p-6 flex flex-col gap-4">
      <div class="rounded-xl bg-terra-soft border border-terra-ring/40 p-4 flex items-center justify-between gap-3">
        <div>
          <div class="text-[11px] font-semibold text-terra tracking-wider uppercase">Belum Dibayar</div>
          <div class="text-[18px] font-bold text-ink-900 bignum mt-0.5">${rupiah(b.sisa)}</div>
        </div>
        <button class="btn-secondary" data-action="tx-fill-full" data-id="${r.id}" type="button">Isi Penuh</button>
      </div>
      <div class="grid sm:grid-cols-2 gap-4">
        ${fld('Jenis Pembayaran',`<select id="txType" class="f-input">${Object.keys(TX).map(k=>`<option value="${k}">${TX[k].label}</option>`).join('')}</select>`)}
        ${fld('Metode',`<select id="txMethod" class="f-input">${METHODS.map(m=>`<option>${m}</option>`).join('')}</select>`)}
        ${fld('Jumlah (Rp)',`<input id="txAmount" type="number" min="0" step="1000" value="${suggestAmount}" class="f-input" placeholder="0">`)}
        ${fld('Tanggal',`<input id="txDate" type="date" value="${toISO(state.today)}" class="f-input">`)}
      </div>
      <div id="txSubWrap" class="hidden">${fld('Keterangan Biaya',`<select id="txSub" class="f-input"><option value="">—</option>${EXTRA_SUBTYPES.map(s=>`<option>${s}</option>`).join('')}</select>`)}</div>
      ${fld('Catatan',`<input id="txNotes" class="f-input" placeholder="opsional">`)}
    </div>
    <div class="px-6 py-4 border-t border-ink-200/60 bg-ink-100/40 flex justify-end gap-2">
      <button class="btn-secondary" data-action="close-modal" type="button">Batal</button>
      <button class="btn-primary" data-action="save-tx" data-id="${r.id}" type="button"><i class="fa-solid fa-check text-[11px]"></i> Simpan Pembayaran</button>
    </div>`,'md'
  );
  setTimeout(()=>{const n=el('txAmount');if(n)n.focus()},50);
  const sel=el('txType');
  if(sel)sel.addEventListener('change',()=>{
    el('txSubWrap').classList.toggle('hidden',sel.value!=='extra');
  });
}
function saveTx(rentalId){
  const r=getRental(rentalId);if(!r)return;
  const type=el('txType').value;
  const amount=clampNum(el('txAmount').value);
  if(amount<=0)return toast('Jumlah harus lebih dari 0','err');
  state.transactions.push({id:nextId('TRX'),rentalId:r.id,tenantId:r.tenantId,roomId:r.roomId,
    type,subtype:type==='extra'?(el('txSub').value||''):'',amount,
    transactionDate:el('txDate').value||toISO(state.today),
    paymentMethod:el('txMethod').value,notes:el('txNotes').value.trim(),status:'posted'});
  persist();closeModal();render();
  toast('Pembayaran dicatat','ok');
}
function deleteTx(txId){
  const i=state.transactions.findIndex(t=>t.id===txId);
  if(i<0)return;
  const t=state.transactions[i];
  if(!confirmAction(`Hapus catatan ${TX[t.type]?TX[t.type].label:t.type} sebesar ${rupiah(t.amount)}?`))return;
  state.transactions.splice(i,1);persist();
  // refresh drawer if open
  if(!el('drawerBackdrop').hidden){
    const openRoomId=[...state.rooms].find(r=>getRoomDisplayStatus(r).rental&&getRoomDisplayStatus(r).rental.id===t.rentalId);
    if(openRoomId)openRoomDrawer(openRoomId.id);
    else closeDrawer();
  }
  render();
  toast('Catatan dihapus','ok');
}

/* ============================================================
   EXPORT CSV
   ============================================================ */
function exportTransactionsCSV(){
  const rows=[['Tanggal','Penyewa','Kamar','Jenis','Metode','Jumlah','Catatan']];
  state.transactions.slice().sort((a,b)=>a.transactionDate.localeCompare(b.transactionDate)).forEach(t=>{
    rows.push([t.transactionDate,tenantName(t.tenantId),(getRoom(t.roomId)||{}).name||'',TX[t.type]?TX[t.type].label:t.type,t.paymentMethod||'',Number(t.amount)||0,t.notes||'']);
  });
  downloadCSV('pembayaran-'+toISO(state.today)+'.csv',rows);
}
function exportBillsCSV(){
  const rows=[['Penyewa','Kamar','Periode','Total Tagihan','Dibayar','Belum Dibayar','Status']];
  state.rentals.filter(r=>r.status!=='cancelled').forEach(r=>{
    const b=calculateBilling(r);
    rows.push([tenantName(r.tenantId),(getRoom(r.roomId)||{}).name||'',`${r.startDate} s/d ${r.endDate}`,b.totalTagihan,b.totalDibayar,b.sisa,getRentalStatus(r).label]);
  });
  downloadCSV('tagihan-'+toISO(state.today)+'.csv',rows);
}
function exportReportCSV(){
  const rm=state.reportMonth;
  const msISO=toISO(new Date(rm.year,rm.month,1,12));
  const meISO=toISO(new Date(rm.year,rm.month+1,0,12));
  const rows=[['Tanggal','Penyewa','Kamar','Jenis','Metode','Jumlah','Catatan']];
  state.transactions.filter(t=>{const d=parseISO(t.transactionDate);return!!d&&t.transactionDate>=msISO&&t.transactionDate<=meISO})
    .forEach(t=>{
      rows.push([t.transactionDate,tenantName(t.tenantId),(getRoom(t.roomId)||{}).name||'',TX[t.type]?TX[t.type].label:t.type,t.paymentMethod||'',t.amount||0,t.notes||'']);
    });
  downloadCSV(`laporan-${rm.year}-${String(rm.month+1).padStart(2,'0')}.csv`,rows);
}
function exportWACSV(){
  const rows=[['Waktu','Penyewa','Kamar','No HP','Sisa','Pesan']];
  state.waHistory.forEach(w=>rows.push([w.sentAt||'',w.tenantName||'',(getRoom(w.roomId)||{}).name||w.roomId||'',w.phone||'',w.sisa||0,w.message||'']));
  downloadCSV('riwayat-wa.csv',rows);
}

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
function switchView(v){
  state.activeView=v;
  if(state.q){state.q=''}
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action],[data-view],[data-global]');
  if(!t)return;
  const id=t.dataset.id;
  if(t.dataset.view!==undefined){switchView(t.dataset.view);return}
  if(t.dataset.global!==undefined){
    if(t.dataset.global==='add-tenant')openTenantForm();
    else if(t.dataset.global==='rent-wizard')openRentWizard();
    return;
  }
  switch(t.dataset.action){
    case 'close-modal':closeModal();break;
    case 'close-drawer':closeDrawer();break;
    case 'stop-bulk':stopBulk();break;
    case 'preview-wa':previewReminder(id);break;
    case 'send-wa-custom':sendWACustom(id);break;
    case 'edit-tenant':closeDrawer();openTenantForm(id);break;
    case 'add-tenant':openTenantForm();break;
    case 'save-tenant':saveTenant(id||null);break;
    case 'add-room':openRoomForm();break;
    case 'edit-room':closeDrawer();openRoomForm(id);break;
    case 'save-room':saveRoom(id||null);break;
    case 'toggle-maint':{
      const r=getRoom(id);
      if(r){r.manualStatus=r.manualStatus==='maintenance'?null:'maintenance';persist();closeDrawer();render()}
      break;
    }
    case 'filter-rooms':state.filter.rooms=id;render();break;
    case 'open-room':openRoomDrawer(id);break;
    case 'open-tenant':openTenantDrawer(id);break;
    case 'rent-room':closeDrawer();openRentWizard({roomId:id});break;
    case 'rent-tenant':closeDrawer();openRentWizard({tenantId:id});break;
    case 'rent-extend':rentExtend(id);break;
    case 'open-rental':closeDrawer();openRentalDetail(id);break;
    case 'edit-rental':closeModal();openRentalForm(id);break;
    case 'add-tx':closeDrawer();openTxForm(id);break;
    case 'quick-pay':closeDrawer();openTxForm(id);break;
    case 'tx-fill-full':{
      const r=getRental(id);if(!r)return;
      const b=calculateBilling(r);el('txAmount').value=b.sisa;break;
    }
    case 'save-tx':saveTx(id);break;
    case 'del-tx':deleteTx(id);break;
    case 'finish-rental':setRentalStatus(id,'finished','Tandai selesai (checkout)');break;
    case 'cancel-rental':setRentalStatus(id,'cancelled','Batalkan');break;
    case 'bulk-wa':startBulkWA();break;
    case 'money-tab':state.moneyTab=id;render();break;
    case 'settings-tab':state.settingsTab=id;render();break;
    case 'report-prev':case 'report-next':{
      const rm=state.reportMonth;
      const d=new Date(rm.year,rm.month+(t.dataset.action==='report-next'?1:-1),1,12);
      state.reportMonth={year:d.getFullYear(),month:d.getMonth()};
      render();break;
    }
    case 'export-tx':exportTransactionsCSV();break;
    case 'export-bills':exportBillsCSV();break;
    case 'export-report':exportReportCSV();break;
    case 'export-data':exportData();break;
    case 'import-data':el('importFile').click();break;
    case 'reset-data':clearAllData();break;
    case 'save-settings':{
      state.settings.lateFeePerDay=clampNum(el('setLateFee').value);
      persist();toast('Pengaturan disimpan','ok');break;
    }
    case 'open-wa-detail':openWADetail(id);break;
    case 'wa-resend':{
      const w=state.waHistory.find(x=>x.id===id);
      if(w)openWA(`https://wa.me/${cleanPhone(w.phone)}?text=${encodeURIComponent(w.message||'')}`);
      break;
    }
    case 'clear-wa':
      if(confirmAction('Hapus seluruh riwayat WhatsApp?')){state.waHistory=[];persistWA();render();toast('Riwayat dihapus','ok')}
      break;
    case 'export-wa':exportWACSV();break;
    case 'open-help':openHelp();break;
    // Wizard actions
    case 'wiz-room':
      wizard.roomId=id;
      renderWizard();
      break;
    case 'wiz-tenant-mode':
      wizard.tenantMode=id;
      renderWizard();
      break;
    case 'wiz-next':wizardNext();break;
    case 'wiz-back':wizardBack();break;
    case 'wiz-finish':wizardFinish();break;
  }
});

/* Form rental lama (dipakai dari tombol Edit Sewa) */
function openRentalForm(rentalId){
  const editing=rentalId?getRental(rentalId):null;
  if(!editing)return;
  const roomId=editing.roomId, tenantId=editing.tenantId;
  const startISO=editing.startDate, dv=editing.durationValue, du=editing.durationUnit;
  const roomOpts=state.rooms.map(r=>`<option value="${esc(r.id)}"${r.id===roomId?' selected':''}>${esc(r.name)} — ${rupiah(r.priceMonthly)}/bln</option>`).join('');
  const tenantOpts=state.tenants.map(t=>`<option value="${esc(t.id)}"${t.id===tenantId?' selected':''}>${esc(t.name)}</option>`).join('');
  openModal(
    modalHeader('Edit Sewa',`${esc(tenantName(tenantId))} · ${esc((getRoom(roomId)||{}).name||'')}`)+
    `<div class="p-6 grid sm:grid-cols-2 gap-4">
      ${fld('Kamar',`<select id="rfRoom" class="f-input">${roomOpts}</select>`)}
      ${fld('Penyewa',`<select id="rfTenant" class="f-input">${tenantOpts}</select>`)}
      ${fld('Tanggal Mulai',`<input id="rfStart" type="date" value="${esc(startISO)}" class="f-input">`)}
      <div></div>
      ${fld('Durasi',`<input id="rfDur" type="number" min="1" value="${dv}" class="f-input">`)}
      ${fld('Satuan',`<select id="rfUnit" class="f-input">
        <option value="day"${du==='day'?' selected':''}>Hari</option>
        <option value="week"${du==='week'?' selected':''}>Minggu</option>
        <option value="month"${du==='month'?' selected':''}>Bulan</option></select>`)}
      ${fld('Harga Total (Rp)',`<input id="rfPrice" type="number" min="0" step="1000" value="${editing.totalPrice}" class="f-input">`)}
    </div>
    <div class="px-6 py-4 border-t border-ink-200/60 bg-ink-100/40 flex justify-end gap-2">
      <button class="btn-secondary" data-action="close-modal" type="button">Batal</button>
      <button class="btn-primary" data-action="save-rental-edit" data-id="${rentalId}" type="button">Simpan Perubahan</button>
    </div>`,'md'
  );
}
function saveRentalEdit(rentalId){
  const r=getRental(rentalId);if(!r)return;
  const roomId=el('rfRoom').value;
  const tenantId=el('rfTenant').value;
  const start=el('rfStart').value;
  const v=parseInt(el('rfDur').value,10)||0;
  const u=el('rfUnit').value;
  const price=clampNum(el('rfPrice').value);
  if(!parseISO(start))return toast('Tanggal tidak valid','err');
  if(v<=0)return toast('Durasi harus > 0','err');
  const p=calculateRentalEndDate(start,v,u);
  if(!p)return toast('Periode tidak valid','err');
  const conflict=checkRentalConflict(roomId,start,toISO(p.end),rentalId);
  if(conflict)return toast(`Bentrok dengan ${tenantName(conflict.tenantId)}`,'err');
  Object.assign(r,{roomId,tenantId,startDate:start,endDate:toISO(p.end),durationValue:v,durationUnit:u,totalPrice:price});
  r.logs=r.logs||[];r.logs.push({date:toISO(state.today),type:'edit',text:'Data sewa diedit',by:'admin'});
  persist();closeModal();render();
  toast('Perubahan disimpan','ok');
}
// Extend the click handler for save-rental-edit
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action="save-rental-edit"]');
  if(t)saveRentalEdit(t.dataset.id);
});

/* ============================================================
   INIT
   ============================================================ */
function bindStatic(){
  el('helpBtn').addEventListener('click',openHelp);
  el('globalAddBtn').addEventListener('click',()=>{
    if(el('globalAddBtn').dataset.global==='add-tenant')openTenantForm();
    else openRentWizard();
  });
  el('importFile').addEventListener('change',e=>{
    const f=e.target.files[0];
    if(f)importData(f);
    e.target.value='';
  });
  el('modalBackdrop').addEventListener('click',e=>{if(e.target===el('modalBackdrop'))closeModal()});
  el('drawerBackdrop').addEventListener('click',e=>{if(e.target===el('drawerBackdrop'))closeDrawer()});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if(!el('drawerBackdrop').hidden)closeDrawer();
      else if(!el('modalBackdrop').hidden)closeModal();
    }
  });
}

function init(){
  if(!loadPersisted())seedData();
  if(!state.reportMonth||!state.reportMonth.year){
    state.reportMonth={year:state.today.getFullYear(),month:state.today.getMonth()};
  }
  bindStatic();
  render();
  // Onboarding pada kunjungan pertama
  setTimeout(showOnboarding,400);
}
init();
</script>
