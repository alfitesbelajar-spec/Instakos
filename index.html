<script>
/* ============================================================
   ⚙️ KONFIGURASI — GANTI 2 NILAI INI
   ============================================================ */
const KM_CONFIG = {
  API_URL:   'PASTE_URL_WEB_APP_ANDA_DI_SINI',
  API_TOKEN: 'km_ubah_token_ini_menjadi_panjang_dan_rahasia_2025'
};

/* ============================================================
   API CLIENT
   ============================================================ */
const KM_API = (() => {
  async function call(action, payload) {
    const res = await fetch(KM_CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: KM_CONFIG.API_TOKEN, payload })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'API error');
    return data;
  }
  return {
    getAllData:    ()                => call('getAllData'),
    syncAll:       (state)           => call('syncAll', state),
    updateBooking: (id, status)      => call('updateBooking', { id, status }),
    deleteBooking: (id)              => call('deleteBooking', { id })
  };
})();

/* ============================================================
   HELPERS (SAMA SEPERTI FILE ASLI)
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el=id=>document.getElementById(id);
const rupiah=n=>'Rp'+Math.round(Number(n)||0).toLocaleString('id-ID');
const clampNum=n=>{const x=parseFloat(n);return(isNaN(x)||x<0)?0:x};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

function toast(msg,type){
  const t=document.createElement('div');
  const map={ ok:'border-l-4 border-sage bg-white', err:'border-l-4 border-terra bg-white', wa:'border-l-4 border-wa bg-white', '':'border-l-4 border-accent bg-white' };
  const icon={ ok:'fa-circle-check text-sage', err:'fa-circle-exclamation text-terra', wa:'fa-brands fa-whatsapp text-wa', '':'fa-circle-info text-accent' };
  t.className='flex items-start gap-3 px-4 py-3 rounded-xl shadow-card text-[13px] font-medium animate-slide-up '+(map[type]||map['']);
  t.innerHTML=`<span class="mt-0.5 text-[13px] flex-shrink-0"><i class="fa-solid ${icon[type]||icon['']}"></i></span><span class="leading-snug">${esc(msg)}</span>`;
  el('toasts').appendChild(t);
  setTimeout(()=>{try{t.remove()}catch(_){}},3400);
}
const confirmAction=msg=>window.confirm(msg);

/* ============================================================
   SYNC INDICATOR
   ============================================================ */
function setSyncStatus(status, label) {
  ['syncIndicator','syncIndicatorMobile'].forEach(id => {
    const wrap = el(id);
    if (!wrap) return;
    const dot = wrap.querySelector('.sync-dot');
    dot.className = 'sync-dot ' + status;
  });
  const lbl = el('syncLabel'); if (lbl) lbl.textContent = label;
  const lblM = el('syncLabelMobile'); if (lblM) lblM.textContent = label;
}

/* ============================================================
   DATE ENGINE (SAMA SEPERTI FILE ASLI)
   ============================================================ */
const MS=86400000;
function parseISO(iso){
  if(!iso)return null;
  const p=String(iso).split('-').map(Number);
  if(p.length!==3||p.some(isNaN))return null;
  return new Date(p[0],p[1]-1,p[2],12);
}
const toISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
const addDays=(d,n)=>{const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x};
function addMonthsClamped(date,n){
  const t=date.getMonth()+n,y=date.getFullYear()+Math.floor(t/12),m=((t%12)+12)%12;
  return new Date(y,m,Math.min(date.getDate(),daysInMonth(y,m)),12);
}
const diffDays=(a,b)=>Math.round((b.getTime()-a.getTime())/MS);
function calculateRentalEndDate(startISO,value,unit){
  const start=parseISO(startISO);
  if(!start||!value||value<=0)return null;
  let end;
  if(unit==='day')end=addDays(start,value-1);
  else if(unit==='week')end=addDays(start,value*7-1);
  else if(unit==='month')end=addDays(addMonthsClamped(start,value),-1);
  else return null;
  return{start,end,totalDays:diffDays(start,end)+1,value,unit};
}
function formatTanggalID(x,withDay){
  const d=typeof x==='string'?parseISO(x):x;
  if(!d)return'-';
  const b=`${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
  return withDay?`${HARI[d.getDay()]}, ${b}`:b;
}
function formatTanggalShort(x){
  const d=typeof x==='string'?parseISO(x):x;
  return d?`${d.getDate()} ${BULAN[d.getMonth()].slice(0,3)} ${d.getFullYear()}`:'-';
}
function formatDateTimeID(iso){
  const d=new Date(iso);
  if(isNaN(d))return'-';
  return `${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

let _persistTimer=null;
let _syncTimer=null;
let _syncing=false;

function persist(){
  // 1. Cache lokal (debounce 200ms)
  clearTimeout(_persistTimer);
  _persistTimer=setTimeout(()=>{
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify({
        rooms:state.rooms,tenants:state.tenants,rentals:state.rentals,
        transactions:state.transactions,waHistory:state.waHistory,
        settings:state.settings,savedAt:new Date().toISOString()
      }));
    }catch(e){console.warn('Cache gagal:',e)}
  },200);

  // 2. Sync ke Google Sheets (debounce 800ms)
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(syncToSheets,800);
}

async function syncToSheets(){
  if(_syncing) return;
  _syncing=true;
  setSyncStatus('syncing','Menyimpan…');
  try{
    const res=await KM_API.syncAll({
      rooms:state.rooms,
      tenants:state.tenants,
      rentals:state.rentals,
      transactions:state.transactions,
      waHistory:state.waHistory,
      settings:state.settings
    });

  }catch(e){
    setSyncStatus('error','Gagal sync');

    _syncing=false;
  }
}

function persistWA(){

}

function migrateData(d){
  if(Array.isArray(d.transactions)){
    d.transactions.forEach(t=>{
      if(t&&t.type&&MIGRATE_TX[t.type])t.type=MIGRATE_TX[t.type];
      if(!t.transactionDate)t.transactionDate=toISO(new Date());
      if(!t.paymentMethod)t.paymentMethod='Transfer Bank';
      if(typeof t.amount!=='number')t.amount=Number(t.amount)||0;
    });
  }
  if(Array.isArray(d.rooms))d.rooms.forEach(r=>{delete r.pricingPlans;if(r.manualStatus===undefined)r.manualStatus=null;if(!r.photos)r.photos='';if(!r.status)r.status='active';});
  if(Array.isArray(d.rentals))d.rentals.forEach(r=>{if(!Array.isArray(r.logs))r.logs=[]});
  if(!Array.isArray(d.waHistory))d.waHistory=[];
  if(!Array.isArray(d.bookings))d.bookings=[];
  return d;
}

async function loadFromServer(){
  setSyncStatus('syncing','Memuat…');
  let cached=null;
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw) cached=JSON.parse(raw);
  }catch(_){}

  try{
    const res=await KM_API.getAllData();
    if(res.ok && res.data){
      const d=migrateData(res.data);
      state.rooms=d.rooms||[];
      state.tenants=d.tenants||[];
      state.rentals=d.rentals||[];
      state.transactions=d.transactions||[];
      state.waHistory=d.waHistory||[];
      state.bookings=d.bookings||[];
      state.settings=Object.assign({lateFeePerDay:20000,kosName:'Kos Melati',kosAddress:'',kosPhone:''},d.settings||{});
      rebuildCounters();
      cacheLocally();
      setSyncStatus('ok','Tersinkron');
      return true;
    }
  }catch(e){
    console.warn('Server tidak dapat dihubungi:',e);
    setSyncStatus('offline','Mode offline');
  }

  if(cached && Array.isArray(cached.rooms)){
    const d=migrateData(cached);
    state.rooms=d.rooms||[];
    state.tenants=d.tenants||[];
    state.rentals=d.rentals||[];
    state.transactions=d.transactions||[];
    state.waHistory=d.waHistory||[];
    state.settings=Object.assign({lateFeePerDay:20000,kosName:'Kos Melati',kosAddress:'',kosPhone:''},d.settings||{});
    rebuildCounters();
    toast('Mode offline: memakai data cache','');
    return true;
  }
  return false;
}

function cacheLocally(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify({
      rooms:state.rooms,tenants:state.tenants,rentals:state.rentals,
      transactions:state.transactions,waHistory:state.waHistory,
      settings:state.settings,savedAt:new Date().toISOString()
    }));
  }catch(_){}
}

function rebuildCounters(){
  const prefixes=['RM','TNT','RTL','TRX','BKG','WA'];
  const map={RM:'rooms',TNT:'tenants',RTL:'rentals',TRX:'transactions',BKG:'bookings',WA:'waHistory'};
  prefixes.forEach(p=>{
    const arr=state[map[p]]||[];
    let max=0;
    arr.forEach(x=>{
      const m=String(x.id||'').match(new RegExp('^'+p+'-(\\d+)$'));
      if(m) max=Math.max(max,parseInt(m[1],10));
    });
    state.counters[p.toLowerCase()]=max;
  });
}

  }).join(',')).join('\r\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});

function importData(file){
  const rd=new FileReader();
  rd.onload=e=>{
    const txt=e.target.result;
    const isJSON=file.name.toLowerCase().endsWith('.json')||txt.trim().startsWith('{');
    if(isJSON){
      try{
        let d=JSON.parse(txt);
        if(!Array.isArray(d.rooms)||!Array.isArray(d.tenants))throw new Error('Format tidak valid');
        if(!confirmAction('Import akan MENGGANTI seluruh data (termasuk di Google Sheets). Lanjutkan?'))return;
        d=migrateData(d);
        state.rooms=d.rooms;
        state.tenants=d.tenants;
        state.rentals=d.rentals||[];
        state.transactions=d.transactions||[];
        state.waHistory=d.waHistory||[];
        state.settings=Object.assign({lateFeePerDay:20000},d.settings||{});
        rebuildCounters();
        persist(); // auto-sync ke Sheets
        render();
        toast('Data berhasil dimuat & disinkronkan','ok');
      }catch(err){toast('Gagal memuat: '+err.message,'err')}
    }else{
      try{
        const lines=txt.split(/\r?\n/).filter(l=>l.trim());
        if(lines.length<1)throw new Error('File kosong');
        const first=lines[0].toLowerCase();
        const startIdx=/nama|name/.test(first)?1:0;
        let added=0;
        for(let i=startIdx;i<lines.length;i++){
          const cols=lines[i].split(',').map(s=>s.trim().replace(/^"|"$/g,''));
          if(!cols[0])continue;
          state.tenants.push({id:nextId('TNT'),name:cols[0],phone:cols[1]||'-',notes:cols[2]||''});
          added++;
        }
        persist();render();
        toast(added+' penyewa ditambahkan','ok');
      }catch(err){toast('Gagal memuat: '+err.message,'err')}
    }
  };
  rd.readAsText(file);
}

  if(fid&&fid!=='q'){
    const el2=el(fid);
    if(el2&&el2.focus){el2.focus();try{el2.setSelectionRange&&el2.setSelectionRange(999,999)}catch(_){}}
  }
}
const matchQ=(...f)=>{
  if(!state.q)return true;
  const hay=f.map(x=>x==null?'':String(x)).join(' ').toLowerCase();
  return hay.includes(state.q.toLowerCase());
};

/* ============================================================
   VIEW: PEMESANAN (BARU) — Booking dari landing page
   ============================================================ */
function viewBookings(){
  const all=state.bookings||[];
  const pending=all.filter(b=>b.status==='pending');
  const approved=all.filter(b=>b.status==='approved');
  const converted=all.filter(b=>b.status==='converted');
  const rejected=all.filter(b=>b.status==='rejected');

  const tabs=[
    ['pending',   `Menunggu (${pending.length})`,   'fa-clock'],
    ['approved',  `Disetujui (${approved.length})`, 'fa-check'],
    ['converted', `Terkonversi (${converted.length})`, 'fa-user-plus'],
    ['rejected',  `Ditolak (${rejected.length})`,   'fa-ban']
  ];
  const list = state.bookingsTab==='pending'   ? pending
             : state.bookingsTab==='approved'  ? approved
             : state.bookingsTab==='converted' ? converted
             : rejected;

  const rows=list.map(b=>{
    const room=getRoom(b.roomId);
    const toneMap={pending:'warning',approved:'info',converted:'success',rejected:'danger'};
    const labelMap={pending:'Menunggu',approved:'Disetujui',converted:'Terkonversi',rejected:'Ditolak'};
    const wa=cleanPhone(b.phone);
    return `<tr class="table-row border-t border-ink-200/60 hover:bg-ink-100/40">
      ${td(`<div class="text-[12.5px] font-semibold text-ink-900">${esc(b.name)}</div>
            <div class="text-[11px] text-ink-400 tabular-nums">${esc(b.phone||'-')}</div>`)}
      ${td(`<div class="text-[12px] text-ink-700">${esc(room?room.name:b.roomId)}</div>
            <div class="text-[11px] text-ink-400 tabular-nums">Mulai ${formatTanggalShort(b.startDate)}</div>`)}
      ${td(`<span class="text-[12px] text-ink-600">${esc(b.durationValue)} ${esc(b.durationUnit)}</span>`,'hidden md:table-cell')}
      ${td(badge(toneMap[b.status]||'muted',labelMap[b.status]||b.status))}
      ${td(`<span class="text-[11px] text-ink-500 tabular-nums whitespace-nowrap">${formatDateTimeID(b.createdAt)}</span>`,'hidden lg:table-cell')}
      ${td(`<div class="flex items-center gap-1.5 justify-end flex-wrap">
        ${wa?`<button class="wa-btn-sm" data-action="booking-wa" data-id="${b.id}" type="button"><i class="fa-brands fa-whatsapp"></i></button>`:''}
        ${b.status==='pending'?`
          <button class="btn-ghost" data-action="booking-reject" data-id="${b.id}" type="button"><i class="fa-solid fa-xmark text-[10px]"></i></button>
          <button class="btn-success-soft text-[11px] px-2.5 py-1.5" data-action="booking-approve" data-id="${b.id}" type="button"><i class="fa-solid fa-check text-[10px]"></i> Setujui</button>
        `:''}
        ${b.status==='approved'?`
          <button class="btn-primary text-[11px] px-2.5 py-1.5" data-action="booking-convert" data-id="${b.id}" type="button"><i class="fa-solid fa-user-plus text-[10px]"></i> Sewakan</button>
        `:''}
        <button class="btn-ghost" data-action="booking-delete" data-id="${b.id}" type="button"><i class="fa-regular fa-trash-can text-[10px]"></i></button>
      </div>`,'text-right')}
    </tr>`;
  }).join('');

  return card(
    cardHead('Pemesanan Online',`${all.length} total booking dari landing page`,
      `<button class="btn-secondary" data-action="booking-refresh" type="button"><i class="fa-solid fa-rotate text-[11px]"></i> <span class="hidden sm:inline">Refresh</span></button>`)+
    `<div class="px-4 sm:px-6 pt-3 pb-2 border-b border-ink-200/60">${tabHTML(tabs,state.bookingsTab,'bookings-tab')}</div>`+
    (rows?tableWrap(`<table class="w-full">${th('Nama / HP','Kamar','Durasi','Status','Dibuat','')}${rows}</table>`)
         :emptyState('fa-calendar-check','Tidak ada booking di kategori ini.'))
  );
}

async function bookingRefresh(){
  try{
    setSyncStatus('syncing','Memuat booking…');
    const res=await KM_API.getAllData();
    if(res.ok && res.data){
      state.bookings=res.data.bookings||[];
      render();
      setSyncStatus('ok','Tersinkron');
      toast('Daftar booking diperbarui','ok');
    }
  }catch(e){
    setSyncStatus('error','Gagal');
    toast('Gagal refresh: '+e.message,'err');
  }
}

async function bookingSetStatus(id,status){
  const b=(state.bookings||[]).find(x=>x.id===id);
  if(!b) return;
  const labelMap={approved:'Setujui',rejected:'Tolak',pending:'Kembalikan ke Menunggu'};
  if(!confirmAction(`${labelMap[status]||'Ubah'} booking dari ${b.name}?`)) return;
  try{
    setSyncStatus('syncing','Menyimpan…');
    const res=await KM_API.updateBooking(id,status);
    if(!res.ok) throw new Error(res.error);
    b.status=status;
    render();
    setSyncStatus('ok','Tersinkron');
    toast('Status booking diperbarui','ok');
  }catch(e){
    setSyncStatus('error','Gagal');
    toast('Gagal: '+e.message,'err');
  }
}

async function bookingDelete(id){
  const b=(state.bookings||[]).find(x=>x.id===id);
  if(!b) return;
  if(!confirmAction(`Hapus booking dari ${b.name}?`)) return;
  try{
    setSyncStatus('syncing','Menghapus…');
    const res=await KM_API.deleteBooking(id);
    if(!res.ok) throw new Error(res.error);
    state.bookings=state.bookings.filter(x=>x.id!==id);
    render();
    setSyncStatus('ok','Tersinkron');
    toast('Booking dihapus','ok');
  }catch(e){
    setSyncStatus('error','Gagal');
    toast('Gagal: '+e.message,'err');
  }
}

function bookingWA(id){
  const b=(state.bookings||[]).find(x=>x.id===id);
  if(!b) return;
  const phone=cleanPhone(b.phone);
  const room=getRoom(b.roomId);
  const msg=`Halo *${b.name}*,\n\nTerima kasih sudah booking *${room?room.name:b.roomId}* mulai *${formatTanggalID(b.startDate,true)}* (${b.durationValue} ${b.durationUnit}).\n\nKami akan segera memproses booking Anda. Mohon konfirmasi ketersediaan Anda.\n\nTerima kasih.`;
  const url=phone?`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url,'_blank');
}

function bookingConvert(id){
  const b=(state.bookings||[]).find(x=>x.id===id);
  if(!b) return;
  if(!confirmAction(`Ubah booking ${b.name} menjadi sewa aktif?`)) return;

  // Buat tenant baru
  const tenant={id:nextId('TNT'),name:b.name,phone:b.phone||'-',email:b.email||'',notes:b.notes||''};
  state.tenants.push(tenant);

  // Buat rental
  const p=calculateRentalEndDate(b.startDate,b.durationValue,b.durationUnit);
  if(!p){toast('Periode booking tidak valid','err');return}
  const room=getRoom(b.roomId);
  const unit=b.durationUnit;
  let price=0;
  if(room){
    if(unit==='month')price=b.durationValue*room.priceMonthly;
    else if(unit==='week')price=b.durationValue*room.priceWeekly;
    else price=b.durationValue*room.priceDaily;
  }
  const rental={
    id:nextId('RTL'),roomId:b.roomId,tenantId:tenant.id,
    startDate:b.startDate,endDate:toISO(p.end),
    durationValue:b.durationValue,durationUnit:unit,
    totalPrice:price,
    status:parseISO(b.startDate)>state.today?'booked':'active',
    previousRentalId:null,availableDate:null,emptyDays:null,
    createdAt:toISO(state.today),logs:[]
  };
  state.rentals.push(rental);

  // Tandai booking converted
  b.status='converted';
  KM_API.updateBooking(id,'converted').catch(()=>{});

  persist();
  render();
  toast('Booking diubah menjadi sewa aktif','ok');
  setTimeout(()=>{
    if(confirmAction('Catat pembayaran pertama sekarang?')) openTxForm(rental.id);
  },250);
}

/* ============================================================
   BIND STATIC (tidak berubah, kecuali init jadi async)
   ============================================================ */
function bindStatic(){
  el('helpBtn').addEventListener('click',openHelp);
  el('globalAddBtn').addEventListener('click',()=>{
    if(el('globalAddBtn').dataset.global==='add-tenant')openTenantForm();
    else openRentWizard();
  });
  el('importFile').addEventListener('change',e=>{
    const f=e.target.files[0];
    if(f)importData(f);
    e.target.value='';
  });
  el('modalBackdrop').addEventListener('click',e=>{if(e.target===el('modalBackdrop'))closeModal()});
  el('drawerBackdrop').addEventListener('click',e=>{if(e.target===el('drawerBackdrop'))closeDrawer()});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if(!el('drawerBackdrop').hidden)closeDrawer();
      else if(!el('modalBackdrop').hidden)closeModal();
    }
  });
}

/* ============================================================
   INIT (DIUBAH: async + load dari server)
   ============================================================ */
async function init(){
  el('content').innerHTML=`<div class="py-20 text-center text-ink-400">
    <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
    <p class="text-[13px] mt-3">Memuat data dari Google Sheets…</p>
  </div>`;

  const ok=await loadFromServer();
  if(!ok){
    // Pertama kali / server belum diisi → seed data lalu push ke Sheets
    seedData();
    await syncToSheets();
  }

  if(!state.reportMonth||!state.reportMonth.year){
    state.reportMonth={year:state.today.getFullYear(),month:state.today.getMonth()};
  }
  bindStatic();
  render();
  setTimeout(showOnboarding,400);
}
init();
